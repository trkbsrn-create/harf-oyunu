<svg xmlns="http://www.w3.org/2000/svg" width="60" height="70" viewBox="0 0 60 70">
  <!-- Küçük robot (tekerlekli, yürür) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="711" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="robot" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#e3e1ea"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#b9b5c6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="30" cy="67" rx="20" ry="3" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 14 v-8" fill="none" stroke-width="2.5"/><circle cx="30" cy="5" r="3.5" fill="#ff7f6a" stroke-width="2"/>
    <rect x="14" y="14" width="32" height="22" rx="6" fill="url(#robot)"/>
    <circle cx="23" cy="25" r="3.5" fill="#7fd6f0" stroke-width="2"/><circle cx="37" cy="25" r="3.5" fill="#7fd6f0" stroke-width="2"/>
    <rect x="10" y="38" width="40" height="20" rx="5" fill="url(#robot)"/>
    <path d="M24 46 h12" fill="none" stroke="#ff7f6a" stroke-width="3"/>
    <circle cx="20" cy="62" r="5" fill="#6b6b80" stroke-width="2.5"/><circle cx="40" cy="62" r="5" fill="#6b6b80" stroke-width="2.5"/>
  </g>
</svg>
