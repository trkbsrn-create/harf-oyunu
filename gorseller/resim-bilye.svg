<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Bilye (cam bilyeler) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="172" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="cam" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="9" height="9" fill="#eef8fc"/>
      <line x1="0" y1="4.5" x2="9" y2="4.5" stroke="#d7eef7" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="40" cy="80" r="24" fill="url(#cam)"/>
    <path d="M28 74 q12 -12 24 0 q-12 14 -24 0z" fill="#ff9c8a" stroke-width="2.5"/>
    <circle cx="88" cy="84" r="20" fill="url(#cam)"/>
    <path d="M78 80 q10 -10 20 0 q-10 12 -20 0z" fill="#7cc3e6" stroke-width="2.5"/>
    <circle cx="68" cy="44" r="18" fill="url(#cam)"/>
    <path d="M60 40 q8 -8 16 0 q-8 10 -16 0z" fill="#ffe680" stroke-width="2.5"/>
    <path d="M30 66 q4 -6 10 -6 M80 70 q4 -6 8 -6 M60 32 q4 -4 8 -4" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
