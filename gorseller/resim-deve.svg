      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#d9b07a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="68" cy="114" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
