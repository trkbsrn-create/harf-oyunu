<svg xmlns="http://www.w3.org/2000/svg" width="540" height="320" viewBox="0 0 540 320">
  <!-- Yeniden başlatma onay penceresi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="49" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kagit" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#fbf4e2"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#f1e6c8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#c9eba7"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="pembe" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffd2c8"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#ff9c8a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect x="22" y="22" width="508" height="290" rx="30" fill="#000" fill-opacity="0.18"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="12" y="12" width="508" height="290" rx="30" fill="url(#kagit)"/>
    <rect x="60" y="200" width="190" height="80" rx="36" fill="url(#yesil)"/>
    <rect x="290" y="200" width="190" height="80" rx="36" fill="url(#pembe)"/>
  </g>
</svg>
