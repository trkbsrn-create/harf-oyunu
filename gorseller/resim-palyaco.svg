<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Palyaço (kırmızı burunlu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="834" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="116" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 116 q0 -36 31 -36 q31 0 31 36z" fill="url(#mavi)"/>
    <circle cx="65" cy="98" r="5" fill="url(#sari)" stroke-width="2"/>
    <circle cx="65" cy="52" r="26" fill="#fff6ec"/>
    <path d="M34 50 q-14 -14 -4 -26 q10 4 10 16 M96 50 q14 -14 4 -26 q-10 4 -10 16" fill="#ff7f6a"/>
    <path d="M48 28 l17 -26 l17 26z" fill="url(#sari)"/>
    <circle cx="65" cy="56" r="7" fill="#e0533d"/>
    <path d="M54 46 h6 M70 46 h6" fill="none" stroke-width="3"/>
    <path d="M52 66 q13 12 26 0" fill="none" stroke="#e0533d" stroke-width="4"/>
  </g>
</svg>
