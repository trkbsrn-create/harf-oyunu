<svg xmlns="http://www.w3.org/2000/svg" width="50" height="80" viewBox="0 0 50 80">
  <!-- Denizatı (sarı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="612" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="denizati" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 20 q14 0 14 14 q0 16 -12 24 q-8 6 -4 14 q6 4 2 8 q-12 0 -12 -10 q0 -10 10 -18 q8 -8 0 -14 q-10 -2 -10 -10 q0 -8 12 -8z" fill="url(#denizati)"/>
    <path d="M24 20 q-6 -6 -2 -14 q6 0 8 8 M18 26 l-14 -2 l12 6z" fill="url(#denizati)" stroke-width="2.5"/>
    <path d="M38 40 q8 2 8 10 q-6 0 -10 -4" fill="#ffc928" stroke-width="2"/>
    <circle cx="24" cy="24" r="2" fill="#2b2b2b" stroke="none"/>
  </g>
</svg>
