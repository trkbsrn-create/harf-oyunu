<svg xmlns="http://www.w3.org/2000/svg" width="130" height="90" viewBox="0 0 130 90">
  <!-- Parlayan uzay mantarları (çalı yerine; oyunda sallanır) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="702" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mantar" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#9ff0c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#4fd09a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="84" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 84 v-24 M66 84 v-40 M96 84 v-22" fill="none" stroke="#e8dcf8" stroke-width="9"/>
    <path d="M36 84 v-24 M66 84 v-40 M96 84 v-22" fill="none" stroke-width="2"/>
    <path d="M16 62 q20 -30 40 0z M38 46 q28 -44 56 0z M78 64 q18 -26 36 0z" fill="url(#mantar)"/>
    <circle cx="56" cy="34" r="3" fill="#ffffff" stroke="none"/><circle cx="74" cy="38" r="2.5" fill="#ffffff" stroke="none"/><circle cx="30" cy="54" r="2" fill="#ffffff" stroke="none"/>
  </g>
</svg>
