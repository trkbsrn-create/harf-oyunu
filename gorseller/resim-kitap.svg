<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kitap (açık) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="245" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sayfa" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#f0f0f0" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="56" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 30 q30 -10 59 6 q29 -16 59 -6 v74 q-30 -10 -59 6 q-29 -16 -59 -6z" fill="url(#mavi)"/>
    <path d="M12 30 q26 -8 53 6 v70 q-27 -14 -53 -6z M118 30 q-26 -8 -53 6 v70 q27 -14 53 -6z" fill="url(#sayfa)"/>
    <path d="M22 46 q18 -4 34 4 M22 60 q18 -4 34 4 M22 74 q18 -4 34 4 M74 50 q16 -8 34 -4 M74 64 q16 -8 34 -4 M74 78 q16 -8 34 -4" fill="none" stroke="#a9a59c" stroke-width="2.5"/>
  </g>
</svg>
