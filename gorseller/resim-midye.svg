<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Midye (açık kabuklu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="832" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="midye" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#5a5f8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#3f4470" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 100 q-56 -10 -56 -50 q20 -26 56 50z" fill="url(#midye)"/>
    <path d="M65 100 q56 -10 56 -50 q-20 -26 -56 50z" fill="url(#midye)"/>
    <ellipse cx="65" cy="84" rx="18" ry="10" fill="#ffb08a" stroke-width="3"/>
  </g>
</svg>
