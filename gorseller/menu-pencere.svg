<svg xmlns="http://www.w3.org/2000/svg" width="500" height="110" viewBox="0 0 500 110">
  <!-- Menü penceresi: yeniden başlat satırı (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="48" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <rect x="14" y="14" width="480" height="90" rx="22" fill="#000" fill-opacity="0.15"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="6" width="480" height="90" rx="22" fill="#fffdf6"/>
    <path d="M70 36 a20 20 0 1 0 6 16" fill="none" stroke-width="5"/>
    <path d="M60 32 l12 4 l-2 -14" fill="none" stroke-width="5"/>
  </g>
</svg>
