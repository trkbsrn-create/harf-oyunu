<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40">
  <!-- Yerde küçük kristal (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="705" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 4 l7 12 l-7 20 l-7 -20z" fill="#c9f1ff" stroke-width="2.5"/>
    <path d="M8 18 l7 6 l-3 12 l-8 -8z M32 18 l-7 6 l3 12 l8 -8z" fill="#e6d4ff" stroke-width="2"/>
  </g>
</svg>
