<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Birleştir Büyüt (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="228" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#bfe3f5"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="38" height="38" rx="8" fill="url(#kirmizi)"/>
    <rect x="52" y="10" width="38" height="38" rx="8" fill="url(#mavi)"/>
    <rect x="10" y="52" width="38" height="38" rx="8" fill="url(#yesil)"/>
    <rect x="52" y="52" width="38" height="38" rx="8" fill="url(#sari)"/>
    <circle cx="28" cy="30" r="7" fill="none" stroke="#2b2b2b" stroke-width="4"/>
    <path d="M35 23 v16" fill="none" stroke="#2b2b2b" stroke-width="4"/>
    <path d="M64 22 v18 M64 30 q0 -8 7 -8 q7 0 7 8 v10" fill="none" stroke-width="4"/>
    <path d="M60 71 h20 M72 63 l8 8 l-8 8" fill="none" stroke-width="4"/>
  </g>
</svg>
