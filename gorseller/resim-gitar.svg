<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Gitar (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="461" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="55" cy="116" rx="36" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 52 l34 -40 l8 6 l-34 40z" fill="url(#kahve)"/>
    <path d="M106 10 l12 -6 l4 12 l-8 4z" fill="url(#kahve)" stroke-width="2.5"/>
    <path d="M76 62 q-2 -18 -22 -14 q-14 2 -14 16 q-20 0 -24 22 q-4 26 22 28 q26 2 32 -22 q4 -14 -2 -20 q10 -4 8 -10z" fill="url(#turuncu)"/>
    <circle cx="56" cy="74" r="8" fill="#2b2b2b"/>
    <path d="M38 96 l70 -82 M42 98 l70 -82" fill="none" stroke-width="1.5"/>
  </g>
</svg>
