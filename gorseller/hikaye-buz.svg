<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Final 3: karlı kıyı, donmuş göl ve ortasındaki buz (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="423" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kar" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="9" height="9" fill="#ffffff"/>
      <line x1="0" y1="4.5" x2="9" y2="4.5" stroke="#e3eef6" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="gok" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#d7efff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#bfe3f5" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="buzGol" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d7efff"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9dcf5" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="cam" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#8fbf8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#5f9e5c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#gok)"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 300 q320 -40 640 -10 q320 30 640 -10 v440 h-1280z" fill="url(#kar)"/>
    <ellipse cx="640" cy="520" rx="420" ry="150" fill="url(#buzGol)"/>
    <ellipse cx="640" cy="520" rx="130" ry="60" fill="#eef8ff" stroke-width="4"/>
    <path d="M140 300 l40 -80 l40 80z M1060 290 l46 -92 l46 92z M260 296 l30 -60 l30 60z" fill="url(#cam)"/>
  </g>
</svg>
