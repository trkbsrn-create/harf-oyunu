<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Çanta (okul çantası) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="126" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="42" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 22 q0 -16 21 -16 q21 0 21 16" fill="none" stroke-width="6"/>
    <path d="M24 30 q0 -10 10 -10 h62 q10 0 10 10 v74 q0 8 -8 8 h-66 q-8 0 -8 -8z" fill="url(#mor)"/>
    <path d="M36 66 h58 v34 q0 4 -4 4 h-50 q-4 0 -4 -4z" fill="url(#sari)"/>
    <path d="M24 46 h82" fill="none" stroke-width="3"/>
    <circle cx="65" cy="46" r="5" fill="#ffffff" stroke-width="3"/>
  </g>
</svg>
