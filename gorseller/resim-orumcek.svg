<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Örümcek (ağında) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="344" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 4 v40" fill="none" stroke-width="2"/>
    <path d="M44 56 l-24 -14 l-10 10 M44 64 l-28 2 l-8 12 M48 72 l-20 18 l0 14 M86 56 l24 -14 l10 10 M86 64 l28 2 l8 12 M82 72 l20 18 l0 14" fill="none" stroke-width="4"/>
    <ellipse cx="65" cy="66" rx="24" ry="20" fill="url(#mor)"/>
    <circle cx="65" cy="44" r="12" fill="url(#mor)"/>
    <circle cx="60" cy="42" r="3" fill="#ffffff" stroke-width="1.5"/><circle cx="70" cy="42" r="3" fill="#ffffff" stroke-width="1.5"/>
  </g>
</svg>
