  <!-- Yıldız Tozu İstasyonu: su tesisiyle aynı biçimde iskele, güverte, ev, depo ve varil borusu (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="64" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#d9dde8"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b7bdd0" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="duvar" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="7" height="7" fill="#f1ecff"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#dcd2fb" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="kiremit" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#c9b4ff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8a6be0" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="depo" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
