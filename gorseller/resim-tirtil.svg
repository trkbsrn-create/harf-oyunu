<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Tırtıl (yeşil, gülen) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="849" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="88" r="14" fill="url(#yesil)"/><circle cx="40" cy="80" r="16" fill="url(#yesil)"/>
    <circle cx="64" cy="86" r="16" fill="url(#yesil)"/><circle cx="88" cy="78" r="17" fill="url(#yesil)"/>
    <circle cx="108" cy="60" r="18" fill="url(#yesil)"/>
    <path d="M102 42 l-6 -16 M114 42 l6 -16" fill="none" stroke-width="3"/>
    <circle cx="104" cy="58" r="3" fill="#2b2b2b"/><circle cx="114" cy="58" r="3" fill="#2b2b2b"/>
    <path d="M102 68 q7 6 14 0" fill="none" stroke-width="2.5"/>
  </g>
</svg>
