<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kelebek (büyük, renkli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="234" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kanatK" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 56 q-30 -50 -52 -36 q-10 20 10 36 q-18 14 -6 34 q20 14 48 -24z" fill="url(#kanatK)"/>
    <path d="M68 56 q30 -50 52 -36 q10 20 -10 36 q18 14 6 34 q-20 14 -48 -24z" fill="url(#kanatK)"/>
    <circle cx="30" cy="38" r="8" fill="url(#mor)" stroke-width="2.5"/><circle cx="100" cy="38" r="8" fill="url(#mor)" stroke-width="2.5"/>
    <circle cx="28" cy="76" r="6" fill="url(#mor)" stroke-width="2.5"/><circle cx="102" cy="76" r="6" fill="url(#mor)" stroke-width="2.5"/>
    <ellipse cx="65" cy="62" rx="7" ry="30" fill="#5a3b2a"/>
    <path d="M62 34 q-8 -16 -18 -20 M68 34 q8 -16 18 -20" fill="none" stroke-width="3"/>
  </g>
</svg>
