<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- İncir (bütün ve yarım) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="202" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="ic2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="5" height="5" fill="#ffb3a8"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#e0533d" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 22 q-4 -10 2 -16" fill="none" stroke-width="4"/>
    <path d="M44 22 q-30 18 -28 52 q4 30 28 32 q24 -2 28 -32 q2 -34 -28 -52z" fill="url(#mor)"/>
    <path d="M100 52 q22 16 20 36 q-4 20 -20 20 q-16 0 -20 -20 q-2 -20 20 -36z" fill="#c9eba7"/>
    <path d="M100 60 q14 14 12 28 q-2 12 -12 12 q-10 0 -12 -12 q-2 -14 12 -28z" fill="url(#ic2)" stroke-width="2.5"/>
  </g>
</svg>
