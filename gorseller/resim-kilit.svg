<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kilit (asma kilit) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="188" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 54 v-16 q0 -26 23 -26 q23 0 23 26 v16" fill="none" stroke-width="11"/>
    <path d="M42 54 v-16 q0 -26 23 -26 q23 0 23 26 v16" fill="none" stroke="#d6d3cc" stroke-width="5"/>
    <path d="M26 54 h78 q6 0 6 6 v44 q0 8 -8 8 h-74 q-8 0 -8 -8 v-44 q0 -6 6 -6z" fill="url(#sari)"/>
    <circle cx="65" cy="76" r="7" fill="#2b2b2b"/>
    <path d="M65 80 v14" fill="none" stroke-width="6"/>
  </g>
</svg>
