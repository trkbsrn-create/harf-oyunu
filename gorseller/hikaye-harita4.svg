<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <!-- Final 4: adalar haritası (1 yeşil, 2 sonbahar, 3 karlı, 4 su altı, 5 uzay kesik çizgili) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="424" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kagit" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#fbf4e2"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#f1e6c8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="cimen" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="8" height="8" fill="#d8f0c0"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#bfe39f" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sonbahar" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="8" height="8" fill="#f2d29a"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#e0b66b" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kar" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#e3eef6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="su" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9ecff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc4ef" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect width="1280" height="720" fill="url(#kagit)"/>
  <rect x="60" y="60" width="1160" height="600" rx="30" fill="url(#su)" opacity="0.6"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M100 460 q70 -90 180 -12 q-70 72 -180 12z" fill="url(#cimen)"/>
    <path d="M360 340 q80 -100 200 -10 q-80 76 -200 10z" fill="url(#sonbahar)"/>
    <path d="M640 430 q90 -110 220 -10 q-90 80 -220 10z" fill="url(#kar)"/>
    <circle cx="1000" cy="420" r="90" fill="#7fbfdc"/>
    <path d="M960 400 q10 -12 20 0 q10 12 20 0 M990 450 q10 -12 20 0 q10 12 20 0" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M1010 470 l-10 -20 l-10 20 M1000 450 v24" fill="none" stroke="#ff7f6a" stroke-width="5"/>
    <circle cx="1110" cy="170" r="70" fill="#2f3a66" stroke="#8a8a8a" stroke-dasharray="14 10"/>
    <ellipse cx="1110" cy="170" rx="104" ry="22" fill="none" stroke="#c4a3ec" stroke-width="5"/>
    <path d="M1080 150 l4 8 l8 2 l-8 2 l-4 8 l-4 -8 l-8 -2 l8 -2z M1140 190 l3 6 l6 2 l-6 2 l-3 6 l-3 -6 l-6 -2 l6 -2z" fill="#ffe680" stroke-width="2"/>
    <path d="M860 420 q40 0 50 0" fill="none" stroke="#e0533d" stroke-dasharray="16 12"/>
    <path d="M1040 340 q30 -60 50 -110" fill="none" stroke="#e0533d" stroke-dasharray="16 12"/>
  </g>
</svg>
