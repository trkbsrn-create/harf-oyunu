<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Zar (iki zar) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="360" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-10 40 60)"><path d="M12 32 h56 v56 h-56z" fill="#ffffff" stroke-width="4"/>
    <circle cx="26" cy="46" r="5" fill="#2b2b2b"/><circle cx="40" cy="60" r="5" fill="#2b2b2b"/><circle cx="54" cy="74" r="5" fill="#2b2b2b"/></g>
    <g transform="rotate(12 92 70)"><path d="M66 44 h52 v52 h-52z" fill="url(#kirmizi)" stroke-width="4"/>
    <circle cx="80" cy="58" r="5" fill="#ffffff"/><circle cx="104" cy="58" r="5" fill="#ffffff"/><circle cx="80" cy="82" r="5" fill="#ffffff"/><circle cx="104" cy="82" r="5" fill="#ffffff"/></g>
  </g>
</svg>
