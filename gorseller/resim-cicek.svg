<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Çiçek (saksıda) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="179" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="saksi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#e0a070"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b8703c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 92 v-42" fill="none" stroke="#6fbf4a" stroke-width="5"/>
    <path d="M64 80 q-26 0 -26 -18 q18 -2 26 18z M64 74 q24 -2 26 -18 q-18 -2 -26 18z" fill="url(#yesil)"/>
    <circle cx="64" cy="18" r="14" fill="url(#pembe)"/><circle cx="84" cy="32" r="14" fill="url(#pembe)"/>
    <circle cx="44" cy="32" r="14" fill="url(#pembe)"/><circle cx="76" cy="52" r="14" fill="url(#pembe)"/><circle cx="52" cy="52" r="14" fill="url(#pembe)"/>
    <circle cx="64" cy="36" r="11" fill="url(#sari)"/>
    <path d="M38 90 h52 l-6 26 h-40z" fill="url(#saksi)"/>
  </g>
</svg>
