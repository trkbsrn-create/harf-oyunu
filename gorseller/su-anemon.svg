      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="602" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="anemon" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#ffb3c7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f07aa0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="70" cy="84" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 84 q-4 -26 34 -28 q38 2 34 28z" fill="#f2a65a"/>
    <path d="M40 58 q-20 -20 -12 -42 M52 56 q-6 -28 4 -46 M64 56 q2 -30 12 -46 M78 56 q10 -26 26 -40 M90 60 q20 -18 34 -22 M34 62 q-20 -8 -28 -26" fill="none" stroke="#f07aa0" stroke-width="9"/>
    <path d="M28 16 a4 4 0 1 0 0.1 0 M56 10 a4 4 0 1 0 0.1 0 M76 10 a4 4 0 1 0 0.1 0 M104 16 a4 4 0 1 0 0.1 0 M124 38 a4 4 0 1 0 0.1 0 M6 36 a4 4 0 1 0 0.1 0" fill="#ffb3c7" stroke-width="2.5"/>
