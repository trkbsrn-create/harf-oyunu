<svg xmlns="http://www.w3.org/2000/svg" width="140" height="90" viewBox="0 0 140 90">
  <!-- Deniz şakayığı (çalı yerine; oyunda sallanır) (doodle tarzı, kendi çizimimiz) -->
  <defs>
