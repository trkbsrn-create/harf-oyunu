<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <!-- Dalgıç askısı ve donmuş göl (ortada kırılacak buz) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="422" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="buzGol" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d7efff"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9dcf5" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="200" cy="408" rx="150" ry="8" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="520" cy="250" rx="150" ry="90" fill="url(#buzGol)"/>
    <ellipse cx="520" cy="240" rx="56" ry="28" fill="#eef8ff" stroke-width="3"/>
    <path d="M520 240 l-26 -12 M520 240 l22 -16 M520 240 l30 8 M520 240 l-12 20" fill="none" stroke="#7cc3e6" stroke-width="3"/>
    <path d="M70 404 v-350 M330 404 v-350 M56 54 h288" fill="none" stroke="#9b6a38" stroke-width="10"/>
    <path d="M70 404 v-350 M330 404 v-350 M56 54 h288" fill="none" stroke-width="2"/>
    <path d="M190 54 v14 q0 6 -6 6" fill="none" stroke-width="3"/>
    <path d="M40 404 h60 M300 404 h60" fill="none" stroke="#9b6a38" stroke-width="10"/>
  </g>
</svg>
