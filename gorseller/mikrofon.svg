<svg xmlns="http://www.w3.org/2000/svg" width="90" height="110" viewBox="0 0 90 110">
  <!-- Mikrofon simgesi: şimdi söyle (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="33" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffb3a8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="45" cy="50" r="40" fill="#ffffff"/>
    <rect x="33" y="18" width="24" height="40" rx="12" fill="url(#kirmizi)"/>
    <path d="M24 46 q0 22 21 22 q21 0 21 -22 M45 68 v12 M34 82 h22" fill="none"/>
  </g>
</svg>
