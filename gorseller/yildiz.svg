<svg xmlns="http://www.w3.org/2000/svg" width="80" height="78" viewBox="0 0 80 78">
  <!-- Ödül yıldızı (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="83" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sariYildiz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="40.0,6.0 49.4,29.1 74.2,30.9 55.2,46.9 61.2,71.1 40.0,58.0 18.8,71.1 24.8,46.9 5.8,30.9 30.6,29.1" fill="url(#sariYildiz)" stroke-width="3.5"/>
    <path d="M30 30 l6 -10" fill="none" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
