<svg xmlns="http://www.w3.org/2000/svg" width="700" height="480" viewBox="0 0 700 480">
  <!-- Kabarcık İstasyonu paneli (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="68" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kagit" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#fbf4e2"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#f1e6c8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="duvar" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="7" height="7" fill="#e6fbf6"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#bfeee3" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="kiremit" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffc2b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff8a6a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="depo" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#e8f8ff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#bfe8f8" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="bant" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#bff0ea"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#6fd3c6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="varilGovde" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
