<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Fare (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="243" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="112" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M106 90 q20 -4 18 -24 q-2 -14 -14 -12" fill="none" stroke-width="3"/>
    <path d="M24 86 q-6 -40 40 -42 q44 0 44 34 q0 22 -40 22 q-40 0 -44 -14z" fill="url(#gri)"/>
    <circle cx="44" cy="40" r="15" fill="url(#gri)"/>
    <circle cx="44" cy="40" r="8" fill="url(#pembe)" stroke-width="2.5"/>
    <path d="M24 86 q-14 -4 -18 -16 q8 -4 20 -2" fill="url(#gri)"/>
    <circle cx="6" cy="70" r="4" fill="#ff9c8a" stroke-width="2.5"/>
    <circle cx="26" cy="66" r="3" fill="#2b2b2b"/>
    <path d="M12 74 l-10 4 M14 78 l-8 8" fill="none" stroke-width="2"/>
  </g>
</svg>
