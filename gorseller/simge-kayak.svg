<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Kayak (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="210" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#bfe3f5"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 78 l30 -50 l18 22 l12 -14 l32 42z" fill="url(#mavi)"/>
    <path d="M26 42 l8 -14 l8 10 q-8 6 -16 4z" fill="#ffffff" stroke-width="3"/>
    <path d="M14 92 l60 -16 q8 -2 8 -8 M22 96 l60 -16 q8 -2 8 -8" fill="none" stroke="#e0533d" stroke-width="5"/>
  </g>
</svg>
