<svg xmlns="http://www.w3.org/2000/svg" width="56" height="70" viewBox="64 40 56 70">
  <!-- Perinin sağ kanadı; sol kanat oyunda aynalanır. Dönme noktası sol orta (omuz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="60" y="36" width="64" height="78">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="7" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kanat" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="7" height="7" fill="#fff3b0"/><line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#ffd34d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)">
    <path d="M68 76 C96 44 112 66 94 84 C112 96 92 116 68 96Z" fill="url(#kanat)" stroke="#2b2b2b" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
</svg>
