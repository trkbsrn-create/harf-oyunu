<svg xmlns="http://www.w3.org/2000/svg" width="130" height="160" viewBox="0 0 130 160">
  <!-- Adanın perisi (yaprak perisi; öğretmenin seçimi C). Kanatlar ayrı: peri-kanat.svg (kendi çizimimiz) -->
