<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Bebek (emzikli, kundakta) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="178" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kundak" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 112 q-8 -50 35 -54 q43 4 35 54z" fill="url(#kundak)"/>
    <circle cx="65" cy="44" r="30" fill="url(#pembe)"/>
    <path d="M58 16 q8 -10 14 0" fill="none" stroke-width="3"/>
    <path d="M50 40 q4 4 8 0 M72 40 q4 4 8 0" fill="none" stroke-width="3"/>
    <circle cx="65" cy="56" r="7" fill="#ffe680" stroke-width="3"/>
    <circle cx="44" cy="52" r="5" fill="#ff9c8a" stroke="none" fill-opacity="0.5"/><circle cx="86" cy="52" r="5" fill="#ff9c8a" stroke="none" fill-opacity="0.5"/>
  </g>
</svg>
