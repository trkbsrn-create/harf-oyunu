<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="300" viewBox="0 0 1430 300">
  <!-- Gezegen halkası: renkli taşlardan yürüme yolu (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="718" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="halka" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#e6d4ff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#b58cf0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="halka2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="8" height="8" fill="#c9f1ff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#7fd6f0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 340 V70 q735 -60 1470 0 V340z" fill="url(#halka)" stroke-width="4"/>
    <path d="M-20 340 V140 q735 -50 1470 0 V340z" fill="url(#halka2)" stroke-width="4"/>
    <path d="M-20 340 V220 q735 -40 1470 0 V340z" fill="url(#halka)" stroke-width="4"/>
    <circle cx="200" cy="110" r="10" fill="#9a8fb0" stroke-width="3"/><circle cx="700" cy="96" r="14" fill="#9a8fb0" stroke-width="3"/>
    <circle cx="1100" cy="180" r="9" fill="#9a8fb0" stroke-width="3"/><circle cx="420" cy="240" r="12" fill="#9a8fb0" stroke-width="3"/>
  </g>
</svg>
