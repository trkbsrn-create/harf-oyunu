<svg xmlns="http://www.w3.org/2000/svg" width="80" height="56" viewBox="0 0 80 56">
  <!-- Yengeç (kırmızı, yandan yürür) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="614" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="40" cy="52" rx="30" ry="4" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 38 l-14 10 M28 42 l-8 12 M52 42 l8 12 M58 38 l14 10" fill="none" stroke-width="4"/>
    <path d="M18 26 q-6 -14 -14 -12 q-4 8 6 12 l-6 4 q8 6 14 2z M62 26 q6 -14 14 -12 q4 8 -6 12 l6 4 q-8 6 -14 2z" fill="url(#kirmizi)" stroke-width="2.5"/>
    <ellipse cx="40" cy="34" rx="24" ry="14" fill="url(#kirmizi)"/>
    <path d="M34 22 v-10 M46 22 v-10" fill="none" stroke-width="3"/>
    <circle cx="34" cy="10" r="3.5" fill="#ffffff"/><circle cx="46" cy="10" r="3.5" fill="#ffffff"/>
    <circle cx="34" cy="10" r="1.5" fill="#2b2b2b" stroke="none"/><circle cx="46" cy="10" r="1.5" fill="#2b2b2b" stroke="none"/>
  </g>
</svg>
