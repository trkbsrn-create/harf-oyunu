<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Reçel kavanozu (çilekli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="285" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="kapak" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="5" height="5" fill="#ffe680"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#ffc928" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="38" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 16 h58 v16 h-58z" fill="url(#kapak)"/>
    <path d="M30 32 h70 q8 0 8 10 v60 q0 10 -10 10 h-66 q-10 0 -10 -10 v-60 q0 -10 8 -10z" fill="#eef8ff"/>
    <path d="M26 54 h78 v48 q0 8 -8 8 h-62 q-8 0 -8 -8z" fill="url(#kirmizi)" stroke-width="3"/>
    <path d="M44 66 h42 v28 h-42z" fill="#ffffff" stroke-width="3"/>
    <path d="M65 74 q-10 -2 -8 8 q2 8 8 10 q6 -2 8 -10 q2 -10 -8 -8z" fill="#e0533d" stroke-width="2"/>
    <path d="M60 74 l5 -4 l5 4" fill="none" stroke="#8fd16a" stroke-width="3"/>
  </g>
</svg>
