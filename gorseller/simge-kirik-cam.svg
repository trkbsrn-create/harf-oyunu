<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Kırık Cam (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="222" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#bfe3f5"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="tahta" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#e3b77e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="10" width="80" height="80" rx="6" fill="url(#tahta)"/>
    <rect x="20" y="20" width="60" height="60" fill="url(#mavi)" stroke-width="3"/>
    <path d="M50 50 l-14 -30 M50 50 l26 -16 M50 50 l24 22 M50 50 l-6 30 M50 50 l-30 6 M36 34 l12 -2 M64 42 l2 14 M40 62 l14 4" fill="none" stroke-width="2.5"/>
  </g>
</svg>
