<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Zincir (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="863" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="22" cy="80" rx="18" ry="12" fill="none" stroke="#2b2b2b" stroke-width="11" transform="rotate(-35 22 80)"/>
    <ellipse cx="22" cy="80" rx="18" ry="12" fill="none" stroke="#c6c2cc" stroke-width="6" transform="rotate(-35 22 80)"/>
    <ellipse cx="50" cy="62" rx="18" ry="12" fill="none" stroke="#2b2b2b" stroke-width="11" transform="rotate(55 50 62)"/>
    <ellipse cx="50" cy="62" rx="18" ry="12" fill="none" stroke="#c6c2cc" stroke-width="6" transform="rotate(55 50 62)"/>
    <ellipse cx="78" cy="44" rx="18" ry="12" fill="none" stroke="#2b2b2b" stroke-width="11" transform="rotate(-35 78 44)"/>
    <ellipse cx="78" cy="44" rx="18" ry="12" fill="none" stroke="#c6c2cc" stroke-width="6" transform="rotate(-35 78 44)"/>
    <ellipse cx="106" cy="26" rx="18" ry="12" fill="none" stroke="#2b2b2b" stroke-width="11" transform="rotate(55 106 26)"/>
    <ellipse cx="106" cy="26" rx="18" ry="12" fill="none" stroke="#c6c2cc" stroke-width="6" transform="rotate(55 106 26)"/>
  </g>
</svg>
