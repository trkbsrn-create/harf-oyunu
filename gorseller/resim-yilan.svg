<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Yılan (yeşil, kıvrık) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="858" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="52" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 96 q20 -24 40 -4 q20 20 40 0 q14 -14 4 -34 q-8 -14 4 -26" fill="none" stroke="#2b2b2b" stroke-width="20"/>
    <path d="M14 96 q20 -24 40 -4 q20 20 40 0 q14 -14 4 -34 q-8 -14 4 -26" fill="none" stroke="#8fd16a" stroke-width="13"/>
    <ellipse cx="108" cy="26" rx="14" ry="10" fill="url(#yesil)"/>
    <circle cx="112" cy="22" r="2.5" fill="#2b2b2b"/>
    <path d="M122 28 l6 2 l-4 4 M128 30 l2 4" fill="none" stroke="#e0533d" stroke-width="2.5"/>
  </g>
</svg>
