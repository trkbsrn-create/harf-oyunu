    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 116 q-4 -24 -18 -40 q-8 -10 -2 -14 q8 -4 18 10 l4 4 v-50 q0 -8 7 -8 q7 0 7 8 v34 v-44 q0 -8 7 -8 q7 0 7 8 v44 v-38 q0 -8 7 -8 q7 0 7 8 v40 v-28 q0 -8 7 -8 q7 0 7 8 v52 q0 22 -16 34z" fill="url(#pembe)"/>
  </g>
</svg>
