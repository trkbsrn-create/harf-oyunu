<svg xmlns="http://www.w3.org/2000/svg" width="40" height="52" viewBox="0 0 40 52">
  <!-- Hava kabarcığı (4. adada damla yerine) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="609" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kabarcikDesen" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#e8f8ff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#bfe8f8" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="20" cy="30" r="17" fill="url(#kabarcikDesen)" stroke-width="3.5"/>
    <path d="M10 26 q2 -8 10 -10" fill="none" stroke="#ffffff" stroke-width="4"/>
    <circle cx="28" cy="38" r="2.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>
