<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Bere (ponponlu yün şapka) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="476" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="65" cy="20" r="13" fill="url(#mavi)"/>
    <path d="M22 86 q-2 -54 43 -54 q45 0 43 54z" fill="url(#kirmizi)"/>
    <path d="M18 84 h94 v24 h-94z" fill="url(#mavi)"/>
    <path d="M30 86 v20 M44 86 v20 M58 86 v20 M72 86 v20 M86 86 v20 M100 86 v20" fill="none" stroke-width="2"/>
  </g>
</svg>
