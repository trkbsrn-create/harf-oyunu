<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Tost (kızarmış, kaşarı akan) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="474" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 84 q-4 -40 30 -44 q8 -12 23 -12 q15 0 23 12 q34 4 30 44z" fill="url(#turuncu)"/>
    <path d="M12 84 h106 v16 h-106z" fill="url(#sari)" stroke-width="3"/>
    <path d="M30 100 v8 M56 100 v12 M84 100 v6" fill="none" stroke="#ffc928" stroke-width="6"/>
    <path d="M36 54 l14 14 M60 46 l20 20 M88 54 l12 12" fill="none" stroke="#b05a1c" stroke-width="4"/>
  </g>
</svg>
