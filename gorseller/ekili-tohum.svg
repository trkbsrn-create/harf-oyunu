<svg xmlns="http://www.w3.org/2000/svg" width="100" height="96" viewBox="0 0 100 96">
  <!-- Toprağa ekilmiş tohum ve filizi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="62" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="koyuToprak" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#8e6340"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#6f4a2c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="tohum" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#f2c48e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d99a4e" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="50" cy="66" rx="34" ry="9" fill="#5e3d22"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 38 q-2 -12 2 -24" fill="none" stroke-width="3.5"/>
    <path d="M52 16 q-14 -10 -20 2 q12 6 20 -2z M53 14 q12 -12 22 -2 q-10 10 -22 2z" fill="#8fd16a" stroke-width="3"/>
    <ellipse cx="50" cy="60" rx="26" ry="23" fill="url(#tohum)" stroke-width="3.5"/>
    <path d="M2 92 q4 -20 22 -25 q8 -4 12 0 q8 -5 14 -1 q8 -4 14 1 q6 -3 12 1 q18 5 22 24z" fill="url(#koyuToprak)" stroke-width="3.5"/>
    <circle cx="20" cy="76" r="2.5" fill="#5e3d22" stroke-width="1.5"/>
    <circle cx="70" cy="80" r="2.5" fill="#5e3d22" stroke-width="1.5"/>
    <circle cx="46" cy="84" r="2" fill="#5e3d22" stroke-width="1.5"/>
  </g>
</svg>
