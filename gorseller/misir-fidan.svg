<svg xmlns="http://www.w3.org/2000/svg" width="130" height="150" viewBox="0 0 130 150">
  <!-- Genç mısır sapı: tohum iki kez sulanınca (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="314" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="koyuToprak" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#8e6340"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#6f4a2c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="misirYaprak" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 140 v-120" fill="none" stroke="#6fbf4a" stroke-width="9"/>
    <path d="M65 140 v-120" fill="none" stroke-width="2"/>
    <path d="M65 116 q-36 -2 -52 -32 q30 4 52 22z M65 92 q36 -6 50 -38 q-30 6 -50 28z M65 66 q-30 -8 -38 -40 q24 10 38 30z M65 44 q20 -16 20 -40 q-16 16 -20 30z" fill="url(#misirYaprak)" stroke-width="3"/>
    <path d="M70 84 q14 -6 14 -28 q-2 -12 -10 -6 q-6 14 -4 34z" fill="url(#sari)" stroke-width="2.5"/>
    <path d="M25.0 146 q40.0 -22 80 0z" fill="url(#koyuToprak)" stroke-width="3.5"/>
  </g>
</svg>
