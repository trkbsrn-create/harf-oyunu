<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <!-- Dev kaplumbağa (yandan, sağa bakar; deniz tabanında) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="620" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kabuk" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="8" height="8" fill="#9fd6a0"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#5fae6a" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="deri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#c9e6b0"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#9fcf86" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="eyer" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="ip" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="5" height="5" fill="#e3b77e"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="fener" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="harita" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#fbf0d0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e8d39a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="anahtar" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="5" height="5" fill="#ffd76a"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#e0a82e" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="340" cy="400" rx="250" ry="14" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M180 330 q-40 40 -96 52 q-6 -24 40 -60z M470 330 q40 40 96 52 q6 -24 -40 -60z" fill="url(#deri)"/>
    <path d="M530 262 q46 -40 92 -32 q46 10 44 42 q-6 28 -46 26 q-30 -2 -90 10z" fill="url(#deri)"/>
    <circle cx="630" cy="252" r="7" fill="#2b2b2b"/><circle cx="632" cy="249" r="2" fill="#ffffff" stroke="none"/>
    <path d="M636 282 q14 4 22 -4" fill="none" stroke-width="3"/>
    <path d="M110 320 q0 -200 230 -210 q230 10 230 210 q-230 30 -460 0z" fill="url(#kabuk)"/>
    <path d="M110 320 q230 40 460 0 l-10 22 q-220 34 -440 0z" fill="url(#deri)" stroke-width="3.5"/>
    <path d="M250 140 l-30 70 l40 60 h160 l40 -60 l-30 -70 M220 210 h-90 M460 210 h90 M260 270 l-30 50 M420 270 l30 50 M300 118 l-4 22 M380 118 l4 22" fill="none" stroke-width="4"/>
    <path d="M90 300 q-30 4 -50 22 q30 6 54 -6z" fill="url(#deri)" stroke-width="3"/>
  </g>
</svg>
