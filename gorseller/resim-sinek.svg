<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Sinek (kanatlı, büyük gözlü) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="451" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 54 q-30 -40 -50 -20 q-8 20 44 26z M65 54 q30 -40 50 -20 q8 20 -44 26z" fill="#eef8ff" stroke-width="3"/>
    <path d="M50 70 l-20 20 M52 80 l-14 26 M80 70 l20 20 M78 80 l14 26" fill="none" stroke-width="3.5"/>
    <ellipse cx="65" cy="76" rx="16" ry="24" fill="url(#gri)"/>
    <path d="M52 76 h26 M52 88 h26" fill="none" stroke-width="2.5"/>
    <circle cx="65" cy="50" r="13" fill="#2b2b2b"/>
    <circle cx="58" cy="46" r="6" fill="#e0533d" stroke-width="2"/><circle cx="72" cy="46" r="6" fill="#e0533d" stroke-width="2"/>
  </g>
</svg>
