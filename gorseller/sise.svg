<svg xmlns="http://www.w3.org/2000/svg" width="90" height="110" viewBox="0 0 90 110">
  <!-- Sihirli su şişesi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="67" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="su" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9ecff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc4ef" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mantar" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#e3b77e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="34" y="6" width="22" height="18" rx="4" fill="url(#mantar)"/>
    <path d="M36 24 v16 q-28 10 -28 36 q0 28 37 28 q37 0 37 -28 q0 -26 -28 -36 v-16z" fill="#ffffff"/>
    <path d="M12 72 q33 -10 66 0 q0 26 -33 26 q-33 0 -33 -26z" fill="url(#su)" stroke-width="3"/>
    <path d="M22 56 q4 -8 10 -10" fill="none" stroke="#cfe9fb" stroke-width="4"/>
  </g>
  <path d="M70 18 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z M18 36 l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z" fill="#ffe680" stroke="#2b2b2b" stroke-width="1.8"/>
  <path d="M38 84 l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2z M54 76 l2 4 l4 2 l-4 2 l-2 4 l-2 -4 l-4 -2 l4 -2z" fill="#ffffff"/>
</svg>
