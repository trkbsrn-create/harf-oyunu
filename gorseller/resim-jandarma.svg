<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Jandarma (haki üniformalı, bereli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="499" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="haki" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#b9c99a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7f9a5a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="116" rx="36" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 116 v-28 q0 -24 35 -24 q35 0 35 24 v28z" fill="url(#haki)"/>
    <path d="M65 66 v50 M46 80 h12 v8 h-12z M72 80 h12 v8 h-12z" fill="none" stroke-width="2.5"/>
    <circle cx="65" cy="42" r="20" fill="#ffe2c6"/>
    <path d="M42 30 q0 -18 28 -18 q24 2 22 18 q-8 -4 -50 0z" fill="#5f7a3a"/>
    <path d="M86 22 l6 -2 l2 6" fill="url(#kirmizi)" stroke-width="2"/>
    <circle cx="58" cy="44" r="2.5" fill="#2b2b2b"/><circle cx="72" cy="44" r="2.5" fill="#2b2b2b"/>
    <path d="M59 52 q6 5 12 0" fill="none" stroke-width="2.5"/>
  </g>
</svg>
