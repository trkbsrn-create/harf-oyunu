<svg xmlns="http://www.w3.org/2000/svg" width="130" height="110" viewBox="0 0 130 110">
  <!-- Arı: a harfinin ipucu resmi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="34" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kanat" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="5" height="5" fill="#ffffff"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#d7efff" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M44 34 q-16 -30 4 -30 q16 2 10 30z M70 32 q4 -30 20 -24 q14 8 -10 26z" fill="url(#kanat)"/>
    <path d="M106 66 l18 4 l-18 8z" fill="#2b2b2b"/>
    <ellipse cx="68" cy="70" rx="42" ry="30" fill="url(#sari)"/>
    <path d="M60 42 q-8 28 0 56 M82 44 q-6 26 0 52" fill="none" stroke-width="9"/>
    <circle cx="30" cy="68" r="21" fill="url(#sari)"/>
    <path d="M22 48 q-4 -14 -12 -16 M34 47 q2 -14 10 -18" fill="none" stroke-width="3"/>
    <circle cx="23" cy="64" r="3" fill="#2b2b2b"/>
    <circle cx="36" cy="64" r="3" fill="#2b2b2b"/>
    <path d="M24 76 q6 6 12 0" fill="none" stroke-width="3"/>
  </g>
</svg>
