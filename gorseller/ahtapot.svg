<svg xmlns="http://www.w3.org/2000/svg" width="90" height="80" viewBox="0 0 90 80">
  <!-- Ahtapot (mor, gülen) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="613" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="45" cy="76" rx="34" ry="4" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 50 q-14 10 -16 24 M32 54 q-6 14 -4 22 M44 56 v20 M56 54 q6 14 4 22 M66 50 q14 10 18 24" fill="none" stroke="#2b2b2b" stroke-width="11"/>
    <path d="M22 50 q-14 10 -16 24 M32 54 q-6 14 -4 22 M44 56 v20 M56 54 q6 14 4 22 M66 50 q14 10 18 24" fill="none" stroke="#c4a3ec" stroke-width="6"/>
    <path d="M14 46 q-4 -42 30 -42 q34 0 30 42 q-30 14 -60 0z" fill="url(#mor)"/>
    <circle cx="34" cy="32" r="3.5" fill="#2b2b2b" stroke="none"/><circle cx="54" cy="32" r="3.5" fill="#2b2b2b" stroke="none"/>
    <path d="M38 42 q6 5 12 0" fill="none" stroke-width="2.5"/>
  </g>
</svg>
