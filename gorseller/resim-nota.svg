<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Nota (müzik notaları) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="254" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="nota" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#c8a2ff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#a77be0" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M46 92 v-72 l60 -12 v72" fill="none" stroke-width="6"/>
    <path d="M46 34 l60 -12 v14 l-60 12z" fill="#2b2b2b"/>
    <ellipse cx="34" cy="94" rx="16" ry="12" transform="rotate(-20 34 94)" fill="url(#nota)"/>
    <ellipse cx="94" cy="82" rx="16" ry="12" transform="rotate(-20 94 82)" fill="url(#nota)"/>
  </g>
</svg>
