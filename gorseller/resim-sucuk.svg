<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Sucuk (at nalı biçiminde, dilimli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="481" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 104 q-24 -40 -6 -70 q20 -30 58 -14 q30 16 22 52 q-4 18 -16 30 l-14 -10 q10 -10 12 -22 q4 -22 -14 -32 q-24 -10 -38 10 q-10 18 4 46z" fill="url(#kirmizi)"/>
    <path d="M30 104 l14 -10 M86 106 l-14 -10" fill="none" stroke-width="4"/>
    <path d="M88 108 q6 6 12 2" fill="none" stroke-width="3"/>
    <circle cx="44" cy="54" r="2.5" fill="#ffffff"/><circle cx="60" cy="38" r="2.5" fill="#ffffff"/><circle cx="84" cy="50" r="2.5" fill="#ffffff"/>
  </g>
</svg>
