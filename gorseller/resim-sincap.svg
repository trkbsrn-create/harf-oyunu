<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Sincap (fındıklı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="247" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="acik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#ffe9cf"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f5c690" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="114" rx="44" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M74 104 q50 4 48 -40 q-2 -40 -30 -50 q-22 -4 -20 18 q14 6 16 28 q2 26 -16 34z" fill="url(#turuncu)"/>
    <path d="M30 112 q-8 -40 22 -46 q26 0 26 46z" fill="url(#turuncu)"/>
    <path d="M42 112 q0 -24 12 -26 q12 4 10 26z" fill="url(#acik)" stroke-width="3"/>
    <circle cx="44" cy="50" r="22" fill="url(#turuncu)"/>
    <path d="M32 32 l-4 -16 l12 10 M54 30 l6 -14 l2 16" fill="url(#turuncu)" stroke-width="3"/>
    <circle cx="36" cy="46" r="3" fill="#2b2b2b"/>
    <circle cx="24" cy="56" r="2.5" fill="#2b2b2b"/>
    <circle cx="44" cy="80" r="9" fill="url(#kahve)" stroke-width="3"/>
  </g>
</svg>
