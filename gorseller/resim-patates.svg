<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Patates (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="257" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="patates" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#e8c08a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c99a63" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 64 q-4 -30 36 -36 q36 -6 56 14 q16 20 0 40 q-16 18 -50 16 q-36 0 -42 -34z" fill="url(#patates)"/>
    <path d="M44 50 l4 2 M78 44 l4 3 M92 70 l-3 4 M54 80 l4 2 M34 68 l3 3" fill="none" stroke-width="3"/>
  </g>
</svg>
