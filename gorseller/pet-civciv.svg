<svg xmlns="http://www.w3.org/2000/svg" width="44" height="44" viewBox="0 0 44 44">
  <!-- Evcil civciv (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="905" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="1.6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="22" cy="41" rx="14" ry="3" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 36 v5 M26 36 v5" fill="none" stroke="#ff9a3c" stroke-width="3"/>
    <ellipse cx="22" cy="26" rx="15" ry="13" fill="url(#sari)"/>
    <circle cx="22" cy="13" r="10" fill="url(#sari)"/>
    <path d="M30 13 l8 2 l-8 3z" fill="#ff9a3c" stroke-width="2"/>
    <circle cx="25" cy="11" r="1.8" fill="#2b2b2b" stroke="none"/>
    <path d="M12 26 q6 6 12 0" fill="none" stroke-width="2.5"/>
    <path d="M20 4 q2 -4 4 0" fill="none" stroke-width="2.5"/>
  </g>
</svg>
