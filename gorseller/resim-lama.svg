<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Lama (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="225" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="lama" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#fff3dc"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e6cfa0" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="66" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 84 v28 M70 86 v26 M98 86 v26 M108 84 v28" fill="none" stroke-width="6"/>
    <path d="M52 70 q2 -20 30 -20 q34 0 32 22 q-2 18 -30 18 q-34 0 -32 -20z" fill="url(#lama)"/>
    <path d="M52 70 q-10 -26 -10 -50 h16 q2 26 10 44z" fill="url(#lama)"/>
    <path d="M28 26 q0 -12 18 -12 q14 0 14 10 v8 h-28 q-6 0 -4 -6z" fill="url(#lama)"/>
    <path d="M44 14 l-2 -12 l8 10 M54 14 l4 -12 l2 12" fill="url(#lama)" stroke-width="3"/>
    <circle cx="46" cy="20" r="2.6" fill="#2b2b2b"/>
    <path d="M30 30 q4 2 8 0" fill="none" stroke-width="2.5"/>
    <path d="M70 56 h30 v14 h-30z" fill="#ff9c8a" stroke-width="3"/>
  </g>
</svg>
