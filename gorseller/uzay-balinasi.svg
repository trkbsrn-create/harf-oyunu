<svg xmlns="http://www.w3.org/2000/svg" width="120" height="70" viewBox="0 0 120 70">
  <!-- Uzay balinası (mor, yıldız benekli; süzülür) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="712" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="balina" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#c6b0f0"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#9a7fe0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 36 l-14 -14 q0 14 6 18 q-6 4 -6 18z" fill="url(#balina)" stroke-width="3"/>
    <path d="M14 38 q10 -30 56 -30 q44 0 46 30 q0 24 -50 24 q-44 0 -52 -24z" fill="url(#balina)"/>
    <path d="M30 46 q40 12 80 -4" fill="none" stroke-width="2"/>
    <circle cx="98" cy="30" r="3" fill="#2b2b2b" stroke="none"/>
    <path d="M50 22 l2 4 l4 1 l-4 1 l-2 4 l-2 -4 l-4 -1 l4 -1z M72 16 l1.5 3 l3 1 l-3 1 l-1.5 3 l-1.5 -3 l-3 -1 l3 -1z" fill="#ffe680" stroke-width="1.2"/>
  </g>
</svg>
