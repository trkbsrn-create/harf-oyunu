<svg xmlns="http://www.w3.org/2000/svg" width="70" height="34" viewBox="0 0 70 34">
  <!-- Yerde yaprak yığını (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="305" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 32 q6 -24 31 -26 q25 2 31 26z" fill="url(#turuncu)" stroke-width="3"/>
    <path d="M18 20 l6 -4 M38 14 l4 6 M50 22 l6 -2" fill="none" stroke="#e0533d" stroke-width="3"/>
  </g>
</svg>
