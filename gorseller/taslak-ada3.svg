  <!-- TASLAK: 3. ada (karlı), kuşbakışı; donmuş göl, buz, dalgıç kıyafeti ve çekiç (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="400" result="g"/>
