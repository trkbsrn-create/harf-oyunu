<svg xmlns="http://www.w3.org/2000/svg" width="160" height="200" viewBox="0 0 160 200">
  <!-- Ağaç gövdesi; tepesi agac-tepe.svg (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="11" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="80" cy="192" rx="42" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 190 l4 -82 M90 190 l-2 -82" fill="none"/>
    <path d="M70 190 q10 -4 20 0 l-2 -82 h-14 z" fill="url(#kahve)" stroke="none"/>
    <path d="M70 190 l4 -82 M90 190 l-2 -82 M66 190 h28" fill="none"/>
    <path d="M76 160 q4 -4 2 -10 M84 130 q-3 -4 -1 -9" fill="none" stroke-width="2.5"/>
  </g>
</svg>
