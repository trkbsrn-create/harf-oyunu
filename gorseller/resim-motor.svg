<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Motor (motosiklet) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="473" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="28" cy="88" r="20" fill="#ffffff" stroke-width="6"/><circle cx="102" cy="88" r="20" fill="#ffffff" stroke-width="6"/>
    <circle cx="28" cy="88" r="4" fill="#2b2b2b"/><circle cx="102" cy="88" r="4" fill="#2b2b2b"/>
    <path d="M28 88 l20 -30 h40 l14 30" fill="none" stroke-width="4"/>
    <path d="M44 58 q6 -16 30 -14 q14 0 18 14z" fill="url(#kirmizi)"/>
    <path d="M90 58 l-6 -26 l12 -4 M84 32 l-8 -2" fill="none" stroke-width="4"/>
    <path d="M40 54 h20" fill="none" stroke-width="7"/>
    <path d="M56 74 h22 v12 h-22z" fill="#a9a59c" stroke-width="3"/>
  </g>
</svg>
