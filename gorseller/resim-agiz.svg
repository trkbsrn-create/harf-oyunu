<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ağız (gülen dudaklar, dişler) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="512" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 56 q22 -26 40 -16 q15 -8 15 0 q0 -8 15 0 q18 -10 40 16 q-22 50 -55 50 q-33 0 -55 -50z" fill="url(#kirmizi)"/>
    <path d="M18 58 q47 12 94 0 q-16 30 -47 30 q-31 0 -47 -30z" fill="#ffffff"/>
    <path d="M18 58 q47 12 94 0" fill="none" stroke-width="3"/>
    <path d="M42 62 v12 M54 64 v14 M66 64 v14 M78 64 v14 M90 62 v12" fill="none" stroke-width="2"/>
    <path d="M40 76 q25 14 50 0" fill="none" stroke="#ff9c8a" stroke-width="4"/>
  </g>
</svg>
