<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Oklava (hamur açma sopası) ve hamur (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="265" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="oklava" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="65" cy="96" rx="52" ry="12" fill="#fff6e0"/>
    <path d="M6 58 h14 v14 h-14z M110 58 h14 v14 h-14z" fill="url(#oklava)"/>
    <path d="M20 54 h90 v22 h-90z" fill="url(#oklava)"/>
    <path d="M6 65 h-2 M124 65 h2" fill="none" stroke-width="4"/>
  </g>
</svg>
