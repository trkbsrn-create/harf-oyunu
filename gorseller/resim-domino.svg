<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Domino taşları (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="269" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="rotate(-12 44 62)"><path d="M26 14 h36 v96 h-36z" fill="#ffffff"/><path d="M26 62 h36" fill="none" stroke-width="3"/>
    <circle cx="36" cy="28" r="4" fill="#2b2b2b"/><circle cx="52" cy="44" r="4" fill="#2b2b2b"/>
    <circle cx="36" cy="76" r="4" fill="#2b2b2b"/><circle cx="52" cy="76" r="4" fill="#2b2b2b"/><circle cx="44" cy="86" r="4" fill="#2b2b2b"/><circle cx="36" cy="96" r="4" fill="#2b2b2b"/><circle cx="52" cy="96" r="4" fill="#2b2b2b"/></g>
    <g transform="rotate(10 90 64)"><path d="M72 16 h36 v96 h-36z" fill="#ffffff"/><path d="M72 64 h36" fill="none" stroke-width="3"/>
    <circle cx="90" cy="40" r="4" fill="#2b2b2b"/>
    <circle cx="82" cy="80" r="4" fill="#2b2b2b"/><circle cx="98" cy="80" r="4" fill="#2b2b2b"/><circle cx="82" cy="96" r="4" fill="#2b2b2b"/><circle cx="98" cy="96" r="4" fill="#2b2b2b"/></g>
  </g>
