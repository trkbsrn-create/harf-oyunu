<svg xmlns="http://www.w3.org/2000/svg" width="100" height="110" viewBox="0 0 100 110">
  <!-- Buz sarmaşığı filizi: tohum bir kez sulanınca (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="413" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="koyuToprak" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#8e6340"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#6f4a2c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="buzYaprak" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#eef8ff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#a9dcf5" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 100 q-6 -30 4 -60" fill="none" stroke="#7cc3e6" stroke-width="6"/>
    <path d="M50 100 q-6 -30 4 -60" fill="none" stroke-width="2"/>
    <path d="M50 70 l-28 -12 l10 -10z M52 56 l28 -14 l-6 14z M54 40 l-6 -26 l12 10z" fill="url(#buzYaprak)" stroke-width="3"/>
    <path d="M15.0 106 q35.0 -22 70 0z" fill="url(#koyuToprak)" stroke-width="3.5"/>
  </g>
</svg>
