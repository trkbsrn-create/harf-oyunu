<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kartal (yandan, dalda tünemiş) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="194" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="beyaz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e6e6e6" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 104 q60 -8 120 4" fill="none" stroke="#8a6a3c" stroke-width="7"/>
    <path d="M80 86 l26 26 l8 -10 l-22 -26z" fill="#5a3b2a"/>
    <path d="M40 54 q6 -22 34 -20 q30 4 32 34 q2 26 -24 30 q-30 4 -40 -14 q-8 -14 -2 -30z" fill="url(#kahve)"/>
    <path d="M60 50 q30 -6 40 22 q4 18 -12 28 q-6 -24 -28 -50z" fill="#8a5a32"/>
    <path d="M56 98 v8 l-6 4 M68 98 v8 l6 4" fill="none" stroke="#ffc928" stroke-width="4"/>
    <circle cx="44" cy="36" r="20" fill="url(#beyaz)"/>
    <path d="M28 28 q-14 2 -16 12 q2 8 8 10 q0 -8 10 -10z" fill="url(#sari)" stroke-width="3"/>
    <circle cx="40" cy="30" r="3" fill="#2b2b2b"/>
    <path d="M34 24 l12 -2" fill="none" stroke-width="3.5"/>
  </g>
</svg>
