<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kartal (açık kanatlı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="194" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="beyaz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e6e6e6" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 56 q-30 -30 -54 -20 q14 6 18 12 q-12 0 -16 6 q16 2 22 8 q-8 4 -8 10 q22 -4 38 0z" fill="url(#kahve)"/>
    <path d="M72 56 q30 -30 54 -20 q-14 6 -18 12 q12 0 16 6 q-16 2 -22 8 q8 4 8 10 q-22 -4 -38 0z" fill="url(#kahve)"/>
    <path d="M52 60 q0 -10 13 -10 q13 0 13 10 l-4 40 l-9 12 l-9 -12z" fill="url(#kahve)"/>
    <circle cx="65" cy="38" r="15" fill="url(#beyaz)"/>
    <path d="M65 40 l12 4 l-10 8z" fill="url(#sari)" stroke-width="2.5"/>
    <circle cx="60" cy="34" r="2.6" fill="#2b2b2b"/><circle cx="72" cy="34" r="2.6" fill="#2b2b2b"/>
  </g>
</svg>
