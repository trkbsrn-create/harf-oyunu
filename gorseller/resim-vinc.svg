<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Vinç (inşaat) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="857" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 114 v-100 M36 20 h88 M36 20 l-22 0 M36 20 l20 -14 l12 14" fill="none" stroke="#ffc928" stroke-width="9"/>
    <path d="M36 114 v-100 M36 20 h88 M14 20 h22" fill="none" stroke-width="2"/>
    <path d="M36 30 l12 12 l-12 12 l12 12 l-12 12 l12 12" fill="none" stroke-width="2"/>
    <path d="M108 20 v50" fill="none" stroke-width="2"/>
    <path d="M98 70 h20 v16 h-20z" fill="#8e6340" stroke-width="3"/>
    <path d="M8 104 h18 v12 h-18z" fill="#6b6b6b" stroke-width="3"/>
    <path d="M20 114 h34" fill="none" stroke-width="6"/>
  </g>
</svg>
