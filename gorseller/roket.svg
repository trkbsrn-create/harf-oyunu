<svg xmlns="http://www.w3.org/2000/svg" width="160" height="300" viewBox="0 0 160 300">
  <!-- Roket (beyaz-kırmızı, pencereli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="626" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M80 8 q50 50 50 150 v80 h-100 v-80 q0 -100 50 -150z" fill="#fbf7ec"/>
    <path d="M80 8 q30 30 42 70 h-84 q12 -40 42 -70z" fill="url(#kirmizi)"/>
    <circle cx="80" cy="130" r="24" fill="url(#mavi)" stroke-width="4"/>
    <path d="M30 180 l-26 60 v40 l26 -20z M130 180 l26 60 v40 l-26 -20z" fill="url(#kirmizi)"/>
    <path d="M44 238 h72 l-8 24 h-56z" fill="url(#gri)"/>
    <path d="M58 200 v20 M102 200 v20" fill="none" stroke-width="3"/>
  </g>
</svg>
