<svg xmlns="http://www.w3.org/2000/svg" width="80" height="70" viewBox="0 0 80 70">
  <!-- Pembe domuz kumbara (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="901" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="40" cy="66" rx="30" ry="4" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 60 v6 M54 60 v6" fill="none" stroke-width="6"/>
    <ellipse cx="40" cy="38" rx="32" ry="24" fill="url(#pembe)"/>
    <path d="M18 20 l4 -12 l10 10z" fill="#ff9c8a" stroke-width="3"/>
    <ellipse cx="68" cy="40" rx="8" ry="9" fill="#ffb3a8" stroke-width="3"/>
    <circle cx="66" cy="38" r="1.6" fill="#2b2b2b" stroke="none"/><circle cx="70" cy="42" r="1.6" fill="#2b2b2b" stroke="none"/>
    <circle cx="54" cy="30" r="2.6" fill="#2b2b2b" stroke="none"/>
    <path d="M32 16 h16" fill="none" stroke-width="5"/>
    <path d="M8 36 q-8 -2 -4 -8" fill="none" stroke-width="3"/>
  </g>
</svg>
