<svg xmlns="http://www.w3.org/2000/svg" width="80" height="70" viewBox="0 0 80 70">
  <!-- Kutu kumbara (üstte yarık, düşen damla) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="901" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="altin" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="5" height="5" fill="#ffe680"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#e0a82e" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="40" cy="66" rx="32" ry="4" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 30 l8 -10 h48 l8 10z" fill="#c98f4f"/>
    <rect x="8" y="30" width="64" height="34" rx="4" fill="url(#tahta)"/>
    <path d="M30 25 h20" fill="none" stroke-width="5"/>
    <path d="M8 40 h64" fill="none" stroke-width="2.5"/>
    <circle cx="40" cy="52" r="6" fill="url(#altin)" stroke-width="2.5"/>
    <path d="M40 2 q-7 9 -7 13 q0 6 7 6 q7 0 7 -6 q0 -4 -7 -13z" fill="#bfe3f5" stroke-width="2.5"/>
  </g>
</svg>
