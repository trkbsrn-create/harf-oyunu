<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Harf Fırtınası (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="230" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#e4e1da"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#b9b5ac" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 48 q-14 -2 -10 -16 q4 -12 18 -8 q4 -18 24 -16 q16 2 18 18 q16 -4 18 10 q2 14 -14 14z" fill="url(#gri)"/>
    <polygon points="50,48 36,72 50,72 42,96 66,64 52,64 60,48" fill="url(#sari)" stroke-width="3"/>
    <path d="M20 60 l-6 12 M80 60 l-6 12" fill="none" stroke="#7cc4ef" stroke-width="4"/>
  </g>
</svg>
