<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Mum (yanan) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="290" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mum" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 14 q-14 18 -6 30 q6 6 12 0 q8 -12 -6 -30z" fill="url(#sari)"/>
    <path d="M65 34 q-4 6 0 10 q4 -4 0 -10z" fill="#ff9c8a" stroke-width="2"/>
    <path d="M65 44 v8" fill="none" stroke-width="3"/>
    <path d="M44 52 h42 v56 h-42z" fill="url(#mum)"/>
    <path d="M44 52 q4 10 8 0 q4 14 8 0" fill="#ffd2c8" stroke-width="2.5"/>
    <path d="M28 108 h74 q0 8 -8 8 h-58 q-8 0 -8 -8z" fill="#d6d3cc" stroke-width="3"/>
  </g>
</svg>
