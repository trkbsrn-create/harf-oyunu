<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ayı (oturan, önden) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="111" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="acik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="44" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="36" cy="18" r="13" fill="url(#kahve)"/>
    <circle cx="94" cy="18" r="13" fill="url(#kahve)"/>
    <path d="M30 112 q-12 -44 35 -48 q47 4 35 48z" fill="url(#kahve)"/>
    <path d="M48 112 q-4 -26 17 -28 q21 2 17 28z" fill="url(#acik)" stroke-width="3"/>
    <circle cx="65" cy="40" r="32" fill="url(#kahve)"/>
    <ellipse cx="65" cy="52" rx="15" ry="11" fill="url(#acik)" stroke-width="3"/>
    <ellipse cx="65" cy="47" rx="6" ry="4" fill="#2b2b2b"/>
    <path d="M65 51 v6 q-5 4 -8 0 M65 57 q5 4 8 0" fill="none" stroke-width="2.5"/>
    <circle cx="52" cy="34" r="3.5" fill="#2b2b2b"/>
    <circle cx="78" cy="34" r="3.5" fill="#2b2b2b"/>
  </g>
</svg>
