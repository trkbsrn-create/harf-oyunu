<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Radyo (eski, antenli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="268" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="52" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 40 l22 -32" fill="none" stroke-width="4"/><circle cx="106" cy="8" r="4" fill="#2b2b2b"/>
    <path d="M12 46 q0 -8 8 -8 h90 q8 0 8 8 v54 q0 8 -8 8 h-90 q-8 0 -8 -8z" fill="url(#turuncu)"/>
    <circle cx="44" cy="74" r="22" fill="#d6d3cc"/>
    <path d="M30 64 h28 M26 74 h36 M30 84 h28" fill="none" stroke-width="3"/>
    <path d="M78 56 h30 v14 h-30z" fill="#fff6e0" stroke-width="3"/><path d="M90 56 v14" fill="none" stroke="#e0533d" stroke-width="3"/>
    <circle cx="84" cy="90" r="7" fill="#d6d3cc" stroke-width="3"/><circle cx="102" cy="90" r="7" fill="#d6d3cc" stroke-width="3"/>
  </g>
</svg>
