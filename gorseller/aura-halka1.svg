<svg xmlns="http://www.w3.org/2000/svg" width="348" height="348" viewBox="0 0 348 348">
  <!-- Hazine pusulası, 1. seviye halkanın bir parçası (doodle tarzı, kendi çizimimiz).
       Oyunda dört yöne döndürülerek kullanılır; ortası karakterin ortasına gelir. -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="3" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sariTarama" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="8" height="8" fill="#ffe680"/>
      <line x1="0" y1="4" x2="8" y2="4" stroke="#ffc928" stroke-width="4" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" fill="none" stroke-linecap="round">
    <path d="M101.3 42.8 A150 150 0 0 1 246.7 42.8" stroke="#2b2b2b" stroke-width="13"/>
    <path d="M101.3 42.8 A150 150 0 0 1 246.7 42.8" stroke="url(#sariTarama)" stroke-width="8"/>
  </g>
</svg>
