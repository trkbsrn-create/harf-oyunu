<svg xmlns="http://www.w3.org/2000/svg" width="100" height="110" viewBox="0 0 100 110">
  <!-- Mısır filizi: tohum bir kez sulanınca (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="313" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="koyuToprak" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#8e6340"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#6f4a2c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="misirYaprak" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 100 v-60" fill="none" stroke="#6fbf4a" stroke-width="6"/>
    <path d="M50 100 v-60" fill="none" stroke-width="2"/>
    <path d="M50 74 q-30 -2 -40 -26 q26 2 40 20z M50 60 q30 -4 38 -30 q-26 4 -38 24z M50 42 q-6 -20 2 -36 q8 16 -2 36z" fill="url(#misirYaprak)" stroke-width="3"/>
    <path d="M15.0 106 q35.0 -22 70 0z" fill="url(#koyuToprak)" stroke-width="3.5"/>
  </g>
</svg>
