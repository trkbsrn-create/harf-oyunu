<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Harf Balonları (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="202" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 62 q4 16 -4 34 M66 58 q-4 18 4 38" fill="none" stroke-width="2.5"/>
    <ellipse cx="34" cy="38" rx="22" ry="26" fill="url(#kirmizi)"/>
    <path d="M30 64 l4 -4 l4 4z" fill="#e0533d" stroke-width="2.5"/>
    <ellipse cx="68" cy="34" rx="22" ry="26" fill="url(#sari)"/>
    <path d="M64 60 l4 -4 l4 4z" fill="#ffc928" stroke-width="2.5"/>
    <path d="M24 26 q4 -8 10 -10 M58 22 q4 -8 10 -10" fill="none" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
