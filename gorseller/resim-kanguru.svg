<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kanguru (yavrulu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="252" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="acik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#ffe9cf"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f5c690" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="116" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M70 100 q40 10 56 -4 q-24 0 -50 -12z" fill="url(#turuncu)"/>
    <path d="M40 112 q-12 -60 20 -70 q30 0 26 50 q0 20 -14 20z" fill="url(#turuncu)"/>
    <path d="M40 112 h26 M64 112 h24" fill="none" stroke-width="5"/>
    <path d="M50 76 q16 -6 26 4 q0 18 -14 18 q-14 0 -12 -22z" fill="url(#acik)" stroke-width="3"/>
    <circle cx="62" cy="72" r="7" fill="url(#turuncu)" stroke-width="2.5"/>
    <path d="M44 46 q-6 -22 14 -28 q18 -2 18 16 q0 14 -14 18z" fill="url(#turuncu)"/>
    <path d="M58 18 l2 -16 l8 14 M48 22 l-6 -14 l12 6" fill="url(#turuncu)" stroke-width="3"/>
    <circle cx="62" cy="32" r="2.8" fill="#2b2b2b"/><circle cx="74" cy="40" r="2" fill="#2b2b2b"/>
  </g>
</svg>
