<svg xmlns="http://www.w3.org/2000/svg" width="500" height="520" viewBox="0 0 500 520">
  <!-- Sihirli su şişesinin içi: her harf için bir bölme (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="70" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="su" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9ecff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc4ef" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mantar" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#e3b77e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="cam" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="8" height="8" fill="#eef8ff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#d7efff" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <rect x="22" y="100" width="472" height="420" rx="70" fill="#000" fill-opacity="0.18"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="214" y="6" width="72" height="42" rx="8" fill="url(#mantar)"/>
    <path d="M202 44 h96 v52 h-96z" fill="url(#cam)"/>
    <rect x="14" y="90" width="472" height="420" rx="70" fill="url(#cam)"/>
    <path d="M44 150 q4 -30 30 -40" fill="none" stroke="#ffffff" stroke-width="8"/>
    <rect x="44" y="124" width="194" height="112" rx="18" fill="#ffffff" stroke-width="3"/>
    <rect x="262" y="124" width="194" height="112" rx="18" fill="#ffffff" stroke-width="3"/>
    <rect x="44" y="252" width="194" height="112" rx="18" fill="#ffffff" stroke-width="3"/>
    <rect x="262" y="252" width="194" height="112" rx="18" fill="#ffffff" stroke-width="3"/>
    <rect x="44" y="380" width="194" height="112" rx="18" fill="#ffffff" stroke-width="3"/>
    <rect x="262" y="380" width="194" height="112" rx="18" fill="#ffffff" stroke-width="3"/>
    <circle cx="470" cy="92" r="28" fill="#ff8a7a"/>
    <path d="M458 80 l24 24 M482 80 l-24 24" fill="none" stroke="#ffffff" stroke-width="7"/>
  </g>
  <path d="M30 40 l5 12 l12 5 l-12 5 l-5 12 l-5 -12 l-12 -5 l12 -5z M440 20 l4 9 l9 4 l-9 4 l-4 9 l-4 -9 l-9 -4 l9 -4z M150 30 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3z" fill="#ffe680" stroke="#2b2b2b" stroke-width="2"/>
</svg>
