<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- İguana (yeşil kertenkele) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="206" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="64" cy="110" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M96 76 q30 0 28 22 q-2 10 -12 8 q6 -16 -16 -18" fill="url(#yesil)"/>
    <path d="M24 70 q10 -20 40 -18 q30 0 36 18 q-4 18 -36 18 q-30 2 -40 -18z" fill="url(#yesil)"/>
    <path d="M30 86 l-6 14 M46 88 l2 16 M80 88 l-2 16 M94 84 l8 14" fill="none" stroke-width="5"/>
    <path d="M30 54 q-24 -6 -26 12 q2 14 24 12z" fill="url(#yesil)"/>
    <path d="M30 52 l6 -10 l6 10 l6 -10 l6 10 l6 -10 l6 10 l6 -10 l6 10 l6 -10 l6 10" fill="#8fd16a" stroke-width="2.5"/>
    <circle cx="16" cy="62" r="3" fill="#2b2b2b"/>
  </g>
</svg>
