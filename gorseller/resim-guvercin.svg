<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Güvercin (yandan, gri) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="431" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="112" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 98 v12 M70 98 v12" fill="none" stroke="#e0533d" stroke-width="4"/>
    <path d="M30 70 q0 -30 30 -32 q30 0 46 22 l16 2 l-14 10 q-10 26 -46 26 q-32 0 -32 -28z" fill="url(#gri)"/>
    <path d="M100 62 q-14 8 -40 6" fill="none" stroke-width="2.5"/>
    <circle cx="38" cy="40" r="14" fill="url(#gri)"/>
    <path d="M30 50 q10 8 22 2" fill="url(#mor)" stroke-width="2.5"/>
    <circle cx="34" cy="36" r="3" fill="#2b2b2b"/>
    <path d="M24 40 l-10 4 l10 3z" fill="#ffc928" stroke-width="2"/>
  </g>
</svg>
