<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Çöp (çöp kutusu ve atılan kâğıt) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="484" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="60" cy="116" rx="38" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 30 h68 l-8 82 h-52z" fill="url(#gri)"/>
    <path d="M18 18 h84 v12 h-84z M50 18 v-8 h20 v8" fill="#a9a59c" stroke-width="3.5"/>
    <path d="M44 42 l4 60 M60 42 v60 M76 42 l-4 60" fill="none" stroke-width="2.5"/>
    <path d="M100 92 q-6 -10 4 -16 q10 4 16 -2 q4 12 -4 18 q-8 6 -16 0z" fill="#ffffff" stroke-width="2.5"/>
    <path d="M110 108 q-4 -6 4 -10 q8 2 8 8 q-4 6 -12 2z" fill="#ffd2c8" stroke-width="2"/>
  </g>
</svg>
