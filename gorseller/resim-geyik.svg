<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Geyik (dallı boynuzlu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="462" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="geyikAcik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="116" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M38 112 v-30 M50 112 v-30 M78 112 v-30 M90 112 v-30" fill="none" stroke-width="5"/>
    <path d="M30 76 q0 -18 30 -18 h24 q16 0 16 18 q0 14 -32 14 h-24 q-14 0 -14 -14z" fill="url(#kahve)"/>
    <path d="M86 62 l8 -20 h12 l-6 22z" fill="url(#kahve)"/>
    <path d="M92 42 q-2 -14 12 -14 q12 0 12 12 q-2 8 -12 10 q-10 0 -12 -8z" fill="url(#kahve)"/>
    <path d="M98 28 l-10 -16 l-8 4 M88 12 l-2 -8 M104 28 l8 -16 l10 2 M112 12 l4 -8" fill="none" stroke="#8e6340" stroke-width="4"/>
    <circle cx="108" cy="36" r="2.5" fill="#2b2b2b"/>
    <ellipse cx="66" cy="78" rx="16" ry="8" fill="url(#geyikAcik)" stroke-width="2"/>
  </g>
</svg>
