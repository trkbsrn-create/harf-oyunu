<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Duvardan Geçme (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="212" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="16" width="84" height="70" fill="url(#kirmizi)"/>
    <path d="M8 32 h84 M8 48 h84 M8 64 h84 M30 16 v16 M62 16 v16 M18 32 v16 M48 32 v16 M78 32 v16 M30 48 v16 M62 48 v16" fill="none" stroke-width="3"/>
    <path d="M36 86 v-24 q14 -16 28 0 v24z" fill="url(#yesil)"/>
  </g>
</svg>
