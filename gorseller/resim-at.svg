<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- At (yandan) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="112" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="70" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 76 v36 M60 78 v34 M94 78 v34 M106 74 v38" fill="none" stroke-width="6"/>
    <path d="M110 52 q16 6 12 40 q-8 -8 -12 -22" fill="#5a3b2a"/>
    <ellipse cx="78" cy="62" rx="40" ry="20" fill="url(#kahve)"/>
    <path d="M44 62 q-6 -22 -12 -36 l16 -8 q10 16 14 36z" fill="url(#kahve)"/>
    <ellipse cx="26" cy="30" rx="20" ry="11" transform="rotate(28 26 30)" fill="url(#kahve)"/>
    <path d="M36 14 l2 -10 l7 10z" fill="url(#kahve)" stroke-width="3"/>
    <path d="M44 16 q10 10 18 40" fill="none" stroke="#5a3b2a" stroke-width="7"/>
    <circle cx="28" cy="24" r="2.8" fill="#2b2b2b"/>
    <circle cx="12" cy="36" r="1.8" fill="#2b2b2b"/>
  </g>
</svg>
