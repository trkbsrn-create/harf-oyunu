<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ayna (masa aynası, içinde gülen yüz) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="120" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="cam" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#e8f6fb"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#c3e4f2" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 92 h14 v12 h-14z" fill="url(#pembe)"/>
    <path d="M36 104 h58 q4 0 4 6 h-66 q0 -6 4 -6z" fill="url(#pembe)"/>
    <ellipse cx="65" cy="50" rx="36" ry="44" fill="url(#pembe)"/>
    <ellipse cx="65" cy="50" rx="27" ry="35" fill="url(#cam)"/>
    <circle cx="67" cy="54" r="13" fill="#ffffff" stroke="#a9a59c" stroke-width="2.5"/>
    <circle cx="62" cy="52" r="1.8" fill="#a9a59c" stroke="none"/>
    <circle cx="72" cy="52" r="1.8" fill="#a9a59c" stroke="none"/>
    <path d="M62 58 q5 4 10 0" fill="none" stroke="#a9a59c" stroke-width="2"/>
    <path d="M48 30 q4 -8 12 -10" fill="none" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
