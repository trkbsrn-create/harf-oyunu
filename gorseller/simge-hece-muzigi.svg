<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Hece Müziği (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="213" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mor" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#d8c2f3"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 72 v-50 l44 -10 v50" fill="none" stroke-width="5"/>
    <path d="M34 24 l44 -10" fill="none" stroke-width="9"/>
    <ellipse cx="24" cy="74" rx="12" ry="9" transform="rotate(-20 24 74)" fill="url(#mor)"/>
    <ellipse cx="68" cy="64" rx="12" ry="9" transform="rotate(-20 68 64)" fill="url(#sari)"/>
  </g>
</svg>
