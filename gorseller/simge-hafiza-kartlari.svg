<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Hafıza Kartları (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="205" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#bfe3f5"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="20" width="44" height="62" rx="8" transform="rotate(-10 30 51)" fill="url(#mavi)"/>
    <path d="M22 44 l16 16 M38 44 l-16 16" fill="none" stroke="#ffffff" stroke-width="4" transform="rotate(-10 30 51)"/>
    <rect x="48" y="16" width="44" height="62" rx="8" transform="rotate(8 70 47)" fill="#fffdf6"/>
    <polygon points="70,32 75,43 87,44 78,52 81,64 70,58 59,64 62,52 53,44 65,43" fill="url(#sari)" stroke-width="3" transform="rotate(8 70 47)"/>
  </g>
</svg>
