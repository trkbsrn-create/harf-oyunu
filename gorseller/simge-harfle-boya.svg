<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Harfle Boya (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="229" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#e3b77e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#d8c2f3"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 60 q-6 -40 36 -48 q42 -4 44 30 q0 16 -16 14 q-12 -2 -12 10 q2 18 -18 22 q-30 4 -34 -28z" fill="#fffdf6"/>
    <circle cx="30" cy="38" r="7" fill="url(#mor)" stroke-width="3"/>
    <circle cx="50" cy="26" r="7" fill="url(#sari)" stroke-width="3"/>
    <circle cx="72" cy="30" r="7" fill="#ff9c8a" stroke-width="3"/>
    <circle cx="30" cy="62" r="7" fill="#8fd16a" stroke-width="3"/>
    <path d="M60 94 l30 -40" fill="none" stroke="#c98f4f" stroke-width="7"/>
    <path d="M86 58 l8 -12 q6 -4 4 4 l-6 12z" fill="#7cc3e6" stroke-width="3"/>
  </g>
</svg>
