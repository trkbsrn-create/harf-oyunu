<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Böcek (uğur böceği) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="350" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 40 l-14 -16 M90 40 l14 -16 M30 64 h-16 M100 64 h16 M34 86 l-14 12 M96 86 l14 12" fill="none" stroke-width="3.5"/>
    <ellipse cx="65" cy="68" rx="38" ry="40" fill="url(#kirmizi)"/>
    <path d="M65 30 v78" fill="none" stroke-width="3"/>
    <path d="M40 34 q25 -26 50 0 q-25 10 -50 0z" fill="#2b2b2b"/>
    <circle cx="48" cy="58" r="7" fill="#2b2b2b"/><circle cx="82" cy="58" r="7" fill="#2b2b2b"/><circle cx="50" cy="86" r="6" fill="#2b2b2b"/><circle cx="80" cy="86" r="6" fill="#2b2b2b"/>
  </g>
</svg>
