<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ispanak demeti (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="261" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 110 q-30 -20 -44 -54 q-8 -24 10 -26 q22 -2 34 40z" fill="url(#yesil)"/>
    <path d="M70 110 q30 -20 44 -54 q8 -24 -10 -26 q-22 -2 -34 40z" fill="url(#yesil)"/>
    <path d="M65 110 q-18 -40 -10 -80 q8 -24 20 0 q8 40 -10 80z" fill="url(#yesil)"/>
    <path d="M60 110 q-16 -28 -30 -60 M70 110 q16 -28 30 -60 M65 108 v-70" fill="none" stroke-width="2.5"/>
    <path d="M52 100 q13 6 26 0 l-2 10 q-11 4 -22 0z" fill="#ff9c8a" stroke-width="3"/>
  </g>
</svg>
