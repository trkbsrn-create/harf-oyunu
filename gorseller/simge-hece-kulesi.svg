<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Hece Kulesi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="227" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#bfe3f5"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#e4e1da"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#b9b5ac" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 4 v12" fill="none" stroke-width="3"/>
    <rect x="34" y="16" width="32" height="18" rx="4" fill="url(#kirmizi)"/>
    <rect x="24" y="48" width="52" height="20" rx="4" fill="url(#sari)"/>
    <rect x="18" y="70" width="64" height="22" rx="4" fill="url(#mavi)"/>
    <path d="M12 92 h76" fill="none" stroke-width="4"/>
  </g>
</svg>
