<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Şeker Patlatma (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="209" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#d8c2f3"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 50 l-22 -16 v32z" fill="url(#mor)"/>
    <path d="M70 50 l22 -16 v32z" fill="url(#mor)"/>
    <ellipse cx="50" cy="50" rx="24" ry="20" fill="url(#pembe)"/>
    <path d="M38 40 q12 10 0 20 M52 34 q12 14 0 30" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M18 14 l4 8 M50 6 v10 M82 14 l-4 8" fill="none" stroke="#ffc928" stroke-width="4"/>
  </g>
</svg>
