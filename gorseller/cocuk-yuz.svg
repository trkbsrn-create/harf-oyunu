<svg xmlns="http://www.w3.org/2000/svg" width="130" height="90" viewBox="0 0 130 90">
  <!-- Dalgıç çocuk yüzerken (yatay, sağa) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="623" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="elbise" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#5d8fb3"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#3f6f94" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="tup" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 50 l-18 -8 M30 56 l-18 8" fill="none" stroke-width="11"/>
    <path d="M30 50 l-18 -8 M30 56 l-18 8" fill="none" stroke="#3f6f94" stroke-width="6"/>
    <path d="M14 42 l-14 -12 l2 18z M14 64 l-14 12 l2 -18z" fill="#ffc928" stroke-width="2.5"/>
    <path d="M44 30 h40 q8 0 8 6 v2 q0 6 -8 6 h-40 q-8 0 -8 -6 v-2 q0 -6 8 -6z" fill="url(#tup)" stroke-width="3"/>
    <path d="M28 46 q0 -10 14 -10 h46 q12 0 12 12 q0 12 -12 12 h-46 q-14 0 -14 -14z" fill="url(#elbise)"/>
    <path d="M86 56 l26 6 M78 58 l20 12" fill="none" stroke-width="10"/>
    <path d="M86 56 l26 6 M78 58 l20 12" fill="none" stroke="#5d8fb3" stroke-width="5"/>
    <circle cx="112" cy="40" r="17" fill="#ffe7cf"/>
    <path d="M96 34 q4 -18 22 -16 q8 2 10 8 q-10 -2 -16 4 q-8 -4 -16 4z" fill="#8a5a33"/>
    <path d="M106 34 h18 q4 0 4 4 v6 q0 4 -4 4 h-18 q-4 0 -4 -4 v-6 q0 -4 4 -4z" fill="#cfeefc" stroke-width="2.5"/>
    <path d="M102 38 h-4" fill="none" stroke="#ffc928" stroke-width="5"/>
    <circle cx="118" cy="41" r="2" fill="#2b2b2b" stroke="none"/>
    <path d="M100 26 v-14 h6" fill="none" stroke-width="7"/>
    <path d="M100 26 v-14 h6" fill="none" stroke="#e0533d" stroke-width="3"/>
  </g>
</svg>
