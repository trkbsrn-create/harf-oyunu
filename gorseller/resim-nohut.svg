<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Nohut (kâsede) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="142" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="nohut" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#f7dc9a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e2b85a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="44" cy="52" r="12" fill="url(#nohut)"/><circle cx="66" cy="46" r="12" fill="url(#nohut)"/>
    <circle cx="88" cy="52" r="12" fill="url(#nohut)"/><circle cx="56" cy="36" r="11" fill="url(#nohut)"/><circle cx="78" cy="34" r="11" fill="url(#nohut)"/>
    <path d="M14 56 h102 q-6 50 -51 52 q-45 -2 -51 -52z" fill="url(#mavi)"/>
    <path d="M40 48 q4 -2 6 2 M62 42 q4 -2 6 2 M84 48 q4 -2 6 2" fill="none" stroke-width="2"/>
  </g>
</svg>
