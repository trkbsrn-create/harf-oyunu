<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Aslan (yüz, yeleli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="121" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 4 l12 10 l16 -4 l4 16 l16 4 l-4 16 l10 12 l-10 12 l4 16 l-16 4 l-4 16 l-16 -4 l-12 10 l-12 -10 l-16 4 l-4 -16 l-16 -4 l4 -16 l-10 -12 l10 -12 l-4 -16 l16 -4 l4 -16 l16 4z" fill="url(#turuncu)"/>
    <circle cx="65" cy="62" r="34" fill="url(#sari)"/>
    <circle cx="40" cy="34" r="7" fill="url(#sari)" stroke-width="3"/>
    <circle cx="90" cy="34" r="7" fill="url(#sari)" stroke-width="3"/>
    <circle cx="53" cy="56" r="4" fill="#2b2b2b"/>
    <circle cx="77" cy="56" r="4" fill="#2b2b2b"/>
    <path d="M58 68 h14 l-7 7z" fill="#5a3b2a" stroke-width="2.5"/>
    <path d="M65 75 q-6 8 -12 4 M65 75 q6 8 12 4" fill="none" stroke-width="2.5"/>
  </g>
</svg>
