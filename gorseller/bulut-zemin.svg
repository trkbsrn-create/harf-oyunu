<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="300" viewBox="0 0 1430 300">
  <!-- Bulutların üstündeki zemin (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="77" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gok" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#e3f2fc" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="golgeGok" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#eaf5fd"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#d2e9f8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 340 V80 H0 q55 -49 110 0 q58 -43 115 0 q47 -74 94 0 q48 -63 96 0 q64 -43 127 0 q74 -72 148 0 q52 -42 103 0 q48 -67 95 0 q58 -44 116 0 q52 -45 105 0 q62 -67 125 0 q46 -47 93 0 q75 -54 150 0 V340 H-20z" fill="url(#gok)" stroke-width="4"/>
    <path d="M0 300 V230 q160 -30 320 0 q160 30 320 0 q160 -30 320 0 q160 30 320 0 q80 -15 150 -5 V300z" fill="url(#golgeGok)" stroke="none"/>
  </g>
</svg>
