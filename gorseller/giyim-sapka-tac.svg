<svg xmlns="http://www.w3.org/2000/svg" width="64" height="48" viewBox="0 0 64 48">
  <!-- Altın taç (taşlı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="904" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="1.2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="altin" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="5" height="5" fill="#ffe680"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#e0a82e" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 44 v-24 l11 10 l11 -18 l11 18 l11 -10 v24z" fill="url(#altin)"/>
    <circle cx="21" cy="38" r="3" fill="#ff8a7a" stroke-width="2"/><circle cx="32" cy="36" r="3.4" fill="#9be3dc" stroke-width="2"/>
    <circle cx="43" cy="38" r="3" fill="#c8a2ff" stroke-width="2"/>
  </g>
</svg>
