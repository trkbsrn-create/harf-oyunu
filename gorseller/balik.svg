<svg xmlns="http://www.w3.org/2000/svg" width="200" height="110" viewBox="0 0 200 110">
  <!-- Hece balığı (oyunda boyanır) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="82" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="balikTarama" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e3e3e3" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M160 55 L196 22 Q186 55 196 88 Z" fill="url(#balikTarama)"/>
    <path d="M70 16 Q92 -2 118 14" fill="url(#balikTarama)"/>
    <ellipse cx="88" cy="55" rx="80" ry="44" fill="url(#balikTarama)"/>
    <circle cx="34" cy="44" r="6" fill="#2b2b2b" stroke-width="0"/>
    <path d="M18 66 q8 6 16 2" fill="none" stroke-width="2.5"/>
  </g>
</svg>
