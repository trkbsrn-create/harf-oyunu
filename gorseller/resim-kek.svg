<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kek (dilimlenmiş kalıp kek) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="471" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 104 v-46 q0 -14 14 -16 q33 -10 66 0 q14 2 14 16 v46z" fill="url(#kahve)"/>
    <path d="M24 46 q10 -14 20 -2 q10 -14 20 -2 q10 -14 20 -2 q10 -12 22 2" fill="none" stroke-width="3"/>
    <path d="M86 104 v-56 l12 -2 q14 2 14 16 v42z" fill="url(#sari)" stroke-width="3"/>
    <path d="M14 104 h102" fill="none" stroke-width="5"/>
    <circle cx="40" cy="72" r="2.5" fill="#2b2b2b"/><circle cx="58" cy="86" r="2.5" fill="#2b2b2b"/><circle cx="70" cy="66" r="2.5" fill="#2b2b2b"/>
  </g>
</svg>
