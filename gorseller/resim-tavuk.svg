<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Tavuk (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="131" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="beyaz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ececec" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="66" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 98 v14 h-8 M78 98 v14 h-8" fill="none" stroke="#f08a3c" stroke-width="4"/>
    <path d="M100 30 q20 10 18 40 q-10 -10 -18 -12 M104 40 q20 20 12 38" fill="url(#beyaz)"/>
    <path d="M36 52 q-4 -18 8 -26 q20 -10 22 16 q30 -6 40 14 q8 24 -16 38 q-24 14 -48 -2 q-14 -14 -6 -40z" fill="url(#beyaz)"/>
    <path d="M40 26 l4 -10 l6 6 l6 -8 l2 12z" fill="url(#kirmizi)" stroke-width="3"/>
    <path d="M36 38 l-14 6 l14 4z" fill="url(#sari)" stroke-width="3"/>
    <path d="M38 48 q-4 10 2 12 q4 -4 2 -12z" fill="#ff9c8a" stroke-width="2.5"/>
    <circle cx="48" cy="36" r="3" fill="#2b2b2b"/>
    <path d="M62 66 q14 14 34 2" fill="none" stroke-width="3"/>
  </g>
</svg>
