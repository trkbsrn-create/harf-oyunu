<svg xmlns="http://www.w3.org/2000/svg" width="70" height="80" viewBox="0 0 70 80">
  <!-- Elbise dolabı (iki kapaklı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="906" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="35" cy="77" rx="28" ry="3" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="8" y="6" width="54" height="66" rx="5" fill="url(#tahta)"/>
    <path d="M35 8 v62" fill="none" stroke-width="3"/>
    <circle cx="30" cy="40" r="3" fill="#ffe680" stroke-width="2"/><circle cx="40" cy="40" r="3" fill="#ffe680" stroke-width="2"/>
    <path d="M14 72 v4 M56 72 v4" fill="none" stroke-width="5"/>
    <path d="M44 16 q5 -6 10 0 l-2 10 h-6z" fill="#ff9c8a" stroke-width="2"/>
  </g>
</svg>
