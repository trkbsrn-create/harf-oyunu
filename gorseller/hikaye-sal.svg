<svg xmlns="http://www.w3.org/2000/svg" width="300" height="230" viewBox="0 0 300 230">
  <!-- Açılış hikâyesi: küçük sal (tahta, direk, yelken); alt ortası (150, 215) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="75" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 190 v-170" fill="none" stroke="#8e6340" stroke-width="9"/>
    <path d="M150 190 v-170" fill="none" stroke-width="2"/>
    <path d="M156 28 q70 50 80 130 h-80z" fill="#ffffff"/>
    <rect x="20" y="188" width="260" height="30" rx="6" fill="url(#tahta)"/>
    <path d="M85 190 v28 M150 190 v28 M215 190 v28" fill="none" stroke-width="2.5"/>
  </g>
</svg>
