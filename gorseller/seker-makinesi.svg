<svg xmlns="http://www.w3.org/2000/svg" width="260" height="420" viewBox="0 0 260 420">
  <!-- Şeker makinesi: cam fanus, kırmızı gövde, çıkış oluğu; kolu ayrı (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="61" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="makine" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="8" height="8" fill="#ff9c8a"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#ef5b5b" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="cam" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="9" height="9" fill="#eef8fc"/>
      <line x1="0" y1="4.5" x2="9" y2="4.5" stroke="#d7eef7" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="130" cy="410" rx="110" ry="8" fill="#000" fill-opacity="0.13"/>
