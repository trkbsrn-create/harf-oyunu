<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Lokum (pudra şekerli küpler) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="223" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesilLokum" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#c9f0e0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7fd6b3" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 70 l14 -10 h30 v32 l-14 10 h-30z" fill="url(#pembe)"/>
    <path d="M14 70 h30 v32 M44 70 l14 -10" fill="none" stroke-width="3"/>
    <path d="M70 76 l14 -10 h30 v32 l-14 10 h-30z" fill="url(#yesilLokum)"/>
    <path d="M70 76 h30 v32 M100 76 l14 -10" fill="none" stroke-width="3"/>
    <path d="M44 38 l14 -10 h30 v32 l-14 10 h-30z" fill="url(#pembe)"/>
    <path d="M44 38 h30 v32 M74 38 l14 -10" fill="none" stroke-width="3"/>
    <circle cx="24" cy="80" r="1.5" fill="#ffffff" stroke="none"/><circle cx="56" cy="48" r="1.5" fill="#ffffff" stroke="none"/><circle cx="84" cy="88" r="1.5" fill="#ffffff" stroke="none"/>
  </g>
</svg>
