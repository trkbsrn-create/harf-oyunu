<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Şahin (yandan, dalda duran; kıvrık sarı gaga, kahverengi kanat) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="432" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sahinAcik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 104 h114" fill="none" stroke="#8e6340" stroke-width="8"/>
    <path d="M8 104 h114" fill="none" stroke-width="2"/>
    <path d="M58 100 l-4 8 M58 100 l2 8 M70 100 l-2 8 M70 100 l4 8" fill="none" stroke="#ffc928" stroke-width="4"/>
    <path d="M44 56 q2 -22 24 -24 q22 2 24 26 q2 30 -12 42 h-26 q-12 -14 -10 -44z" fill="url(#sahinAcik)"/>
    <path d="M54 66 l4 4 M66 70 l4 4 M56 80 l4 4 M70 84 l4 4" fill="none" stroke="#b07a42" stroke-width="2.5"/>
    <path d="M88 44 q22 10 22 40 l-6 34 l-16 -20 q-10 -26 0 -54z" fill="url(#kahve)"/>
    <path d="M96 60 q6 14 4 30 M104 70 q2 10 0 22" fill="none" stroke-width="2"/>
    <circle cx="66" cy="32" r="18" fill="url(#kahve)"/>
    <path d="M52 30 q8 -4 16 4 q-8 6 -16 -4z" fill="#ffffff" stroke-width="2"/>
    <circle cx="58" cy="31" r="3" fill="#2b2b2b"/>
    <path d="M50 34 q-12 0 -14 8 q6 -2 10 2 q2 -6 6 -6z" fill="#ffc928" stroke-width="2.5"/>
  </g>
</svg>
