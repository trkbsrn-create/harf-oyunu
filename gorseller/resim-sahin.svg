<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Şahin (kanatları açık, uçan) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="432" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sahinAcik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 54 q-30 -30 -60 -20 q20 10 24 30 q20 -2 36 -2z M65 54 q30 -30 60 -20 q-20 10 -24 30 q-20 -2 -36 -2z" fill="url(#kahve)"/>
    <path d="M14 38 l8 6 M24 34 l6 8 M116 38 l-8 6 M106 34 l-6 8" fill="none" stroke-width="2.5"/>
    <ellipse cx="65" cy="66" rx="14" ry="26" fill="url(#sahinAcik)"/>
    <path d="M56 90 l9 20 l9 -20z" fill="url(#kahve)"/>
    <circle cx="65" cy="40" r="11" fill="url(#sahinAcik)"/>
    <circle cx="61" cy="38" r="2.5" fill="#2b2b2b"/><circle cx="69" cy="38" r="2.5" fill="#2b2b2b"/>
    <path d="M62 44 l3 8 l3 -8z" fill="#ffc928" stroke-width="2"/>
  </g>
</svg>
