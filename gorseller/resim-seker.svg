<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Şeker (ambalajlı, iki ucu bükülmüş) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="273" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 62 l-26 -22 v44z M96 62 l26 -22 v44z" fill="url(#sari)"/>
    <ellipse cx="65" cy="62" rx="34" ry="26" fill="url(#pembe)"/>
    <path d="M44 48 q8 14 0 28 M60 38 q8 24 0 48 M76 38 q8 24 0 48" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M18 50 l8 4 M18 74 l8 -4 M112 50 l-8 4 M112 74 l-8 -4" fill="none" stroke-width="2.5"/>
  </g>
</svg>
