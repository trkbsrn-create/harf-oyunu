<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <!-- İksir formülü parçası: merak (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="721" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="cam" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#e8f6ff"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c9e6f5" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="merak" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#fff6c4"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffe680" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="cesaret" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffb08a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f0705a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sabir" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c6b0f0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#9a7fe0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kesif" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#c9f1ff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7fd6f0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="basari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f0b84a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(40 70)"><path d="M70 28 a14 14 0 1 1 -0.1 0z" fill="url(#merak)"/><path d="M58 40 q-30 -10 -34 16 q-2 20 18 22 q14 0 12 14 v8" fill="none" stroke="#ffe680" stroke-width="9"/><path d="M58 40 q-30 -10 -34 16 q-2 20 18 22 q14 0 12 14 v8" fill="none" stroke-width="2"/><circle cx="54" cy="104" r="4" fill="#ffe680"/></g>
  </g>
</svg>
