<svg xmlns="http://www.w3.org/2000/svg" width="90" height="130" viewBox="0 0 90 130">
  <!-- Kız karakter (doodle_ciz.py üretir). Ana karakter, yürüme karesi: sağ ayak havada (kendi çizimimiz) -->
  <defs>
    <!-- Kalem titremesi: çizgileri hafifçe büker, elle çizilmiş gibi gösterir -->
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="5" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tisort" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="canta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#9be3dc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#4fc3b8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sort" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="7" height="7" fill="#5d8fb3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#3f6f94" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="bere" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#9be3dc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#4fc3b8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="45" cy="124" rx="24" ry="4" fill="#000" fill-opacity="0.15"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- sırt çantası (omuzların arkasından görünür) -->
    <rect x="22" y="54" width="46" height="36" rx="10" fill="url(#canta)"/>
    <!-- bacaklar ve ayakkabılar (kalem çizgisi) -->
    <path d="M38 96 l-3 22 M52 96 l1 13" fill="none" stroke-width="12"/><path d="M38 96 l-3 22 M52 96 l1 13" fill="none" stroke="#5d8fb3" stroke-width="7"/>
    <path d="M28 119 h10 M50 110 h10" fill="none" stroke="#6b4a2b" stroke-width="8"/>
    <!-- şort -->
    <path d="M30 85 h30 l8 15 h-46 z" fill="url(#sort)"/>
    <!-- kollar -->
    <path d="M26 66 l-16 18 M64 66 l4 24" fill="none" stroke-width="12"/><path d="M26 66 l-16 18 M64 66 l4 24" fill="none" stroke="#ff9c8a" stroke-width="7"/>
    <!-- tişört -->
    <path d="M26 64 q19 -8 38 0 l3 32 h-44 z" fill="url(#tisort)"/>
    <!-- çanta askıları -->
    <path d="M33 62 v22 M57 62 v22" fill="none" stroke="#2c7c76" stroke-width="4"/>
    <!-- baş -->
    <circle cx="45" cy="36" r="23" fill="#ffe7cf"/>
    <!-- saç: karalama gibi -->
    <path d="M22 36 q-1 -26 23 -26 q24 0 23 26 q-5 -8 -11 -9 q-6 7 -12 2 q-6 5 -12 -2 q-6 1 -11 9z" fill="#8a5a33"/>
    <path d="M22 34 q-12 6 -10 22 q4 4 8 -2 q-2 -10 4 -16z M68 34 q12 6 10 22 q-4 4 -8 -2 q2 -10 -4 -16z" fill="#8a5a33"/>
    <circle cx="21" cy="38" r="3.5" fill="#ff7fa8" stroke-width="2"/><circle cx="69" cy="38" r="3.5" fill="#ff7fa8" stroke-width="2"/>
    <path d="M52 12 l-8 -6 v12z M52 12 l8 -6 v12z" fill="#ff7fa8" stroke-width="2.5"/>
  </g>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 31 q0 -23 24 -23 q24 0 24 23z" fill="url(#bere)"/>
    <path d="M19 31 h52" fill="none" stroke-width="9"/><path d="M19 31 h52" fill="none" stroke="#ff9c8a" stroke-width="5"/>
    <circle cx="45" cy="9" r="5" fill="#ffffff"/>
    <path d="M27 59 q18 9 36 0 l1 7 q-19 9 -38 0z" fill="#ffe680"/>
    <path d="M54 64 l3 16 h7 l-4 -17z" fill="#ffe680"/>
  </g>
  <!-- yüz -->
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-linecap="round">
    <circle cx="37" cy="38" r="2.6" fill="#2b2b2b"/>
    <circle cx="53" cy="38" r="2.6" fill="#2b2b2b"/>
    <path d="M38 47 q7 7 14 0" fill="none" stroke-width="3"/>
    <path d="M28 45 l4 -2 M58 43 l4 2" fill="none" stroke="#f08a7a" stroke-width="3"/>
  </g>
</svg>
