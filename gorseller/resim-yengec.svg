      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="155" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 80 l-16 16 M36 88 l-12 20 M100 80 l16 16 M94 88 l12 20" fill="none" stroke-width="5"/>
    <path d="M36 62 l-14 -22 M94 62 l14 -22" fill="none" stroke-width="5"/>
    <path d="M22 40 q-18 -6 -14 -22 q10 -8 20 0 l-6 6 l10 6z M108 40 q18 -6 14 -22 q-10 -8 -20 0 l6 6 l-10 6z" fill="url(#kirmizi)"/>
    <ellipse cx="65" cy="76" rx="40" ry="26" fill="url(#kirmizi)"/>
    <path d="M54 52 v-12 M76 52 v-12" fill="none" stroke-width="3"/>
    <circle cx="54" cy="38" r="6" fill="#ffffff" stroke-width="3"/><circle cx="76" cy="38" r="6" fill="#ffffff" stroke-width="3"/>
    <circle cx="54" cy="38" r="2.5" fill="#2b2b2b"/><circle cx="76" cy="38" r="2.5" fill="#2b2b2b"/>
    <path d="M56 84 q9 6 18 0" fill="none" stroke-width="3"/>
  </g>
</svg>
