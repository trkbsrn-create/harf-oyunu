<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Tavşan (oturan, uzun kulaklı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="181" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="beyaz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e6e6e6" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 44 q-14 -30 -6 -42 q12 4 14 40z M80 44 q14 -30 6 -42 q-12 4 -14 40z" fill="url(#beyaz)"/>
    <path d="M50 38 q-8 -20 -4 -30 q6 4 8 30z M80 38 q8 -20 4 -30 q-6 4 -8 30z" fill="url(#pembe)" stroke-width="2.5"/>
    <path d="M34 112 q-10 -44 31 -48 q41 4 31 48z" fill="url(#beyaz)"/>
    <circle cx="100" cy="100" r="9" fill="url(#beyaz)"/>
    <circle cx="65" cy="58" r="24" fill="url(#beyaz)"/>
    <circle cx="56" cy="54" r="3.5" fill="#2b2b2b"/><circle cx="74" cy="54" r="3.5" fill="#2b2b2b"/>
    <path d="M62 62 h6 l-3 4z" fill="#ff9c8a" stroke-width="2"/>
    <path d="M65 66 q-4 6 -8 4 M65 66 q4 6 8 4" fill="none" stroke-width="2.5"/>
  </g>
</svg>
