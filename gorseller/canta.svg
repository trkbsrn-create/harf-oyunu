<svg xmlns="http://www.w3.org/2000/svg" width="100" height="110" viewBox="0 0 100 110">
  <!-- Sırt çantası düğmesi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="31" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="canta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#9be3dc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#4fc3b8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="cep" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="7" height="7" fill="#ffffff"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#dff5f2" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 22 q0 -16 14 -16 q14 0 14 16" fill="none"/>
    <path d="M14 30 q0 -12 14 -12 h44 q14 0 14 12 v62 q0 12 -14 12 h-44 q-14 0 -14 -12z" fill="url(#canta)"/>
    <path d="M14 46 q36 16 72 0" fill="none"/>
    <rect x="28" y="62" width="44" height="30" rx="8" fill="url(#cep)"/>
    <rect x="44" y="56" width="12" height="14" rx="4" fill="url(#sari)"/>
  </g>
</svg>
