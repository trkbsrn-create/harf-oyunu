<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kumbara (domuz şeklinde) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="127" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="112" rx="44" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 92 v18 M52 96 v14 M78 96 v14 M94 92 v18" fill="none" stroke-width="7"/>
    <ellipse cx="66" cy="70" rx="48" ry="34" fill="url(#pembe)"/>
    <path d="M38 40 l-6 -16 l18 8z" fill="url(#pembe)" stroke-width="3"/>
    <ellipse cx="18" cy="72" rx="10" ry="13" fill="#ffd2c8"/>
    <circle cx="15" cy="68" r="2" fill="#2b2b2b"/>
    <circle cx="15" cy="76" r="2" fill="#2b2b2b"/>
    <circle cx="38" cy="58" r="3.5" fill="#2b2b2b"/>
    <path d="M60 38 h24" fill="none" stroke-width="5"/>
    <circle cx="72" cy="20" r="11" fill="url(#sari)" stroke-width="3"/>
    <path d="M114 66 q10 -4 6 -12" fill="none" stroke-width="3"/>
  </g>
</svg>
