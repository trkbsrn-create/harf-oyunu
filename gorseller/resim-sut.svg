<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Süt (kutu ve bardak) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="186" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kutu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="cam" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="9" height="9" fill="#eef8fc"/>
      <line x1="0" y1="4.5" x2="9" y2="4.5" stroke="#d7eef7" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 40 l14 -22 h28 l14 22 v70 h-56z" fill="url(#kutu)"/>
    <path d="M20 40 h56" fill="none" stroke-width="3"/>
    <path d="M30 62 h36 v26 h-36z" fill="#ffffff"/>
    <path d="M40 76 q8 -8 16 0" fill="none" stroke-width="2.5"/>
    <path d="M84 58 h34 l-4 52 h-26z" fill="url(#cam)"/>
    <path d="M86 70 h30 l-3 40 h-24z" fill="#ffffff" stroke="none"/>
    <path d="M84 58 h34 l-4 52 h-26z M86 70 h30" fill="none"/>
  </g>
</svg>
