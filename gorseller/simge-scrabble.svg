<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Scrabble (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="214" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#e3b77e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="34" width="28" height="30" rx="5" fill="url(#tahta)" transform="rotate(-6 20 49)"/>
    <rect x="36" y="30" width="28" height="30" rx="5" fill="url(#tahta)"/>
    <rect x="66" y="34" width="28" height="30" rx="5" fill="url(#tahta)" transform="rotate(6 80 49)"/>
    <circle cx="48" cy="46" r="6" fill="none" stroke="#2b2b2b" stroke-width="4"/>
    <path d="M54 40 v14" fill="none" stroke="#2b2b2b" stroke-width="4"/>
    <path d="M14 44 v14 M14 50 q0 -6 6 -6 q6 0 6 6 v8 M78 38 v16 q0 5 6 5 M74 45 h10" fill="none" stroke-width="3.5"/>
    <path d="M10 76 h80" fill="none" stroke="#c98f4f" stroke-width="7"/>
  </g>
</svg>
