<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kuzu (küçük, yana bakan) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="281" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yun" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e3e0d8" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="112" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 84 v24 M54 86 v24 M76 86 v24 M88 84 v24" fill="none" stroke-width="5"/>
    <path d="M30 70 q-8 -24 14 -28 q8 -14 24 -6 q16 -8 26 6 q20 6 10 28 q4 18 -18 18 q-10 8 -24 0 q-14 8 -24 -2 q-14 -2 -8 -16z" fill="url(#yun)"/>
    <ellipse cx="102" cy="48" rx="16" ry="13" fill="#f2d7b0"/>
    <path d="M92 40 q-10 -4 -10 6 q6 2 10 -2z" fill="#f2d7b0" stroke-width="3"/>
    <circle cx="106" cy="46" r="2.5" fill="#2b2b2b"/><path d="M112 54 q-4 3 -8 0" fill="none" stroke-width="2.5"/>
  </g>
</svg>
