<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Gemi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="174" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="beyaz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ececec" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 96 q30 -8 56 0 q30 8 58 0" fill="none" stroke="#7cc3e6" stroke-width="4"/>
    <path d="M12 70 h106 l-14 26 h-80z" fill="url(#kirmizi)"/>
    <path d="M30 70 v-20 h66 v20z" fill="url(#beyaz)"/>
    <path d="M44 50 v-20 h16 v20z M72 50 v-24 h16 v24z" fill="url(#mavi)"/>
    <circle cx="44" cy="60" r="4" fill="#bfe3f5" stroke-width="2.5"/><circle cx="62" cy="60" r="4" fill="#bfe3f5" stroke-width="2.5"/><circle cx="80" cy="60" r="4" fill="#bfe3f5" stroke-width="2.5"/>
    <path d="M52 22 q-4 -8 2 -14 M80 18 q-4 -8 2 -14" fill="none" stroke="#a9a59c" stroke-width="3"/>
  </g>
</svg>
