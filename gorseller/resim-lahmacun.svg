<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Lahmacun (dilimlenmiş) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="227" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hamur" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#f7d08a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#d99a4e" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="56" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="65" cy="66" rx="58" ry="40" fill="url(#hamur)"/>
    <ellipse cx="65" cy="66" rx="48" ry="31" fill="url(#kirmizi)"/>
    <circle cx="44" cy="58" r="4" fill="#5a3b2a" stroke-width="2"/><circle cx="70" cy="50" r="4" fill="#5a3b2a" stroke-width="2"/>
    <circle cx="84" cy="74" r="4" fill="#5a3b2a" stroke-width="2"/><circle cx="54" cy="80" r="4" fill="#5a3b2a" stroke-width="2"/>
    <path d="M60 64 q6 -10 14 -6 q-4 10 -14 6z M36 72 q6 -8 12 -4 q-4 8 -12 4z M90 58 q6 -8 12 -4 q-4 8 -12 4z" fill="url(#yesil)" stroke-width="2"/>
  </g>
</svg>
