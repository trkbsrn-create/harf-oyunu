<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Yorgan (yatakta) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="148" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yorgan" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="12" height="12" fill="#ffd2c8"/>
      <line x1="0" y1="6.0" x2="12" y2="6.0" stroke="#ff9c8a" stroke-width="4" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 100 v14 M120 100 v14 M10 40 v74 M120 70 v44" fill="none" stroke-width="6"/>
    <path d="M10 70 h110 v34 h-110z" fill="url(#kahve)"/>
    <path d="M14 58 q4 -12 24 -10 h10 q8 4 6 14 q-20 4 -40 -4z" fill="#ffffff"/>
    <path d="M44 54 h72 q6 0 6 8 v30 q0 8 -8 8 h-70z" fill="url(#yorgan)"/>
    <path d="M60 54 v46 M80 54 v46 M100 54 v46" fill="none" stroke-width="2.5"/>
  </g>
</svg>
