<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <!-- Dalgıç kıyafeti askısı (küçük, solda) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="425" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="130.0" cy="404.4" rx="82.5" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(20 180) scale(0.55)">
    <path d="M70 404 v-350 M330 404 v-350 M56 54 h288" fill="none" stroke="#9b6a38" stroke-width="14"/>
    <path d="M70 404 v-350 M330 404 v-350 M56 54 h288" fill="none" stroke-width="3"/>
    <path d="M190 54 v14 q0 6 -6 6" fill="none" stroke-width="4"/>
    <path d="M40 404 h60 M300 404 h60" fill="none" stroke="#9b6a38" stroke-width="14"/>
    </g>
  </g>
</svg>
