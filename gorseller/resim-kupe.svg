<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Küpe (bir çift) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="169" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="tas" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="5" height="5" fill="#d8c2f3"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#a77be0" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="40" cy="22" r="8" fill="url(#sari)"/>
    <circle cx="90" cy="22" r="8" fill="url(#sari)"/>
    <path d="M40 30 v14 M90 30 v14" fill="none" stroke-width="3"/>
    <path d="M40 44 q20 26 0 64 q-20 -38 0 -64z M90 44 q20 26 0 64 q-20 -38 0 -64z" fill="url(#tas)"/>
    <path d="M34 66 q2 -8 4 -10 M84 66 q2 -8 4 -10" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
