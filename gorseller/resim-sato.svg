<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Şato (kuleli, bayraklı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="458" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="56" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 112 v-60 h70 v60z" fill="url(#gri)"/>
    <path d="M30 52 v-8 h10 v8 h10 v-8 h10 v8 h10 v-8 h10 v8 h10 v-8 h10 v8" fill="none" stroke-width="3"/>
    <path d="M10 112 v-74 h22 v74 M98 112 v-74 h22 v74" fill="url(#gri)" stroke-width="3.5"/>
    <path d="M8 38 l13 -24 l13 24z M96 38 l13 -24 l13 24z" fill="url(#mavi)" stroke-width="3"/>
    <path d="M21 14 v-10 l10 4 l-10 4 M109 14 v-10 l10 4 l-10 4" fill="url(#kirmizi)" stroke-width="2"/>
    <path d="M54 112 v-26 q11 -14 22 0 v26" fill="#8e6340" stroke-width="3"/>
    <path d="M44 64 h8 v12 h-8z M78 64 h8 v12 h-8z" fill="#2b2b2b" stroke-width="2"/>
  </g>
</svg>
