<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Salyangoz (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="843" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="salyangoz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sAcik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="52" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 106 q30 0 50 -10 h56 q8 0 8 8 v4 h-114z" fill="url(#sAcik)"/>
    <path d="M100 98 q0 -40 10 -50 M110 98 q4 -40 14 -44" fill="none" stroke-width="3"/>
    <circle cx="110" cy="46" r="4" fill="#2b2b2b"/><circle cx="124" cy="52" r="4" fill="#2b2b2b"/>
    <circle cx="62" cy="62" r="38" fill="url(#salyangoz)"/>
    <path d="M62 62 m-4 0 a4 4 0 1 1 8 0 a10 10 0 1 1 -20 0 a17 17 0 1 1 34 0 a25 25 0 1 1 -50 0" fill="none" stroke-width="3"/>
  </g>
</svg>
