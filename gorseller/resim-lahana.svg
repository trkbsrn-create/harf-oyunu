<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Lahana (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="222" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="lahana" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#d4f0b0"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#9ccf6a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="48" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="65" cy="64" r="48" fill="url(#lahana)"/>
    <path d="M65 16 q-30 30 -10 96 M65 16 q30 30 10 96 M20 50 q30 4 45 30 M110 50 q-30 4 -45 30" fill="none" stroke-width="3"/>
    <path d="M30 34 q20 16 35 -2 q15 18 35 2" fill="none" stroke-width="3"/>
  </g>
</svg>
