<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Jöle (tabakta, titrek, kırmızı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="447" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 104 h102 q0 10 -51 10 q-51 0 -51 -10z" fill="#ffffff"/>
    <path d="M28 104 q-4 -40 6 -66 q30 -14 62 0 q10 26 6 66z" fill="url(#kirmizi)"/>
    <path d="M34 38 q31 10 62 0" fill="none" stroke-width="3"/>
    <path d="M42 54 q-4 20 0 36" fill="none" stroke="#ffffff" stroke-width="5"/>
    <path d="M58 26 q4 -10 10 -2" fill="none" stroke="#5f9e3c" stroke-width="4"/><circle cx="60" cy="28" r="6" fill="#e0533d" stroke-width="2"/>
  </g>
</svg>
