<svg xmlns="http://www.w3.org/2000/svg" width="1430" height="300" viewBox="0 0 1430 300">
  <!-- Su yüzeyi: deniz ve yüzeye çıkan kum adacığı (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="624" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yDeniz" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="8" height="8" fill="#bfe3f5"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yKum" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="8" height="8" fill="#fbe8b0"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#f3cf6a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-20 340 V40 q60 -16 120 0 q60 16 120 0 q60 -16 120 0 q60 16 120 0 q60 -16 120 0 q60 16 120 0 q60 -16 120 0 q60 16 120 0 q60 -16 120 0 q60 16 120 0 q60 -16 120 0 q60 16 120 0 q60 -16 120 0 V340z" fill="url(#yDeniz)" stroke-width="4"/>
    <path d="M-20 340 V96 q140 -40 300 -26 q200 -20 420 -6 q220 -22 440 0 q160 -14 310 10 V340z" fill="url(#yKum)" stroke-width="4"/>
    <path d="M60 70 q14 -6 28 0 M400 60 q14 -6 28 0 M900 56 q14 -6 28 0 M1240 64 q14 -6 28 0" fill="none" stroke="#ffffff" stroke-width="4"/>
    <path d="M180 200 l14 -8 l-4 14z M1100 240 l12 -10 l-2 14z" fill="#ffd2c8" stroke-width="2.5"/>
  </g>
</svg>
