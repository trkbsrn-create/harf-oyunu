<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Bağ (fiyonk bağlanmış ayakkabı bağı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="508" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="52" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 104 v-26 q0 -12 14 -14 l28 -4 l22 -24 h20 l4 30 q26 6 26 26 v12z" fill="#fbf7ec"/>
    <path d="M10 98 h114" fill="none" stroke-width="5"/>
    <path d="M70 46 l14 6 M66 54 l16 6 M62 62 l16 6" fill="none" stroke="#e0533d" stroke-width="4"/>
    <path d="M78 46 q-30 -30 -34 -4 q8 12 34 4z M78 46 q22 -36 34 -12 q-8 16 -34 12z" fill="url(#kirmizi)" stroke-width="3"/>
    <path d="M78 46 l-16 30 M78 46 l10 32" fill="none" stroke="#e0533d" stroke-width="5"/>
    <circle cx="78" cy="46" r="5" fill="url(#kirmizi)" stroke-width="2.5"/>
  </g>
</svg>
