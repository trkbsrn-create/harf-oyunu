<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Akvaryum (fanus, içinde küçük balık ve yosun) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="274" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 22 h70 q22 30 18 60 q-4 26 -28 30 h-50 q-24 -4 -28 -30 q-4 -30 18 -60z" fill="#eef8ff"/>
    <path d="M16 48 h98 q4 14 4 34 q-4 26 -28 30 h-50 q-24 -4 -28 -30 q0 -20 4 -34z" fill="url(#mavi)" stroke-width="3"/>
    <path d="M30 108 q-4 -20 6 -36 q-6 18 4 34 M98 108 q4 -16 -4 -30 q8 14 2 30" fill="url(#yesil)" stroke-width="3"/>
    <path d="M56 78 q12 -14 26 0 q-14 14 -26 0z M56 78 l-10 -8 v16z" fill="url(#turuncu)" stroke-width="3"/>
    <circle cx="76" cy="76" r="2" fill="#2b2b2b"/>
    <circle cx="84" cy="62" r="3" fill="#ffffff" stroke-width="2"/><circle cx="90" cy="54" r="2" fill="#ffffff" stroke-width="2"/>
    <path d="M26 112 h78" fill="none" stroke-width="4"/>
  </g>
</svg>
