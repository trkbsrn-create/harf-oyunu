<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- İnci (istiridyede) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="203" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="istiridye" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#f2d7c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9a090" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="inci" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="5" height="5" fill="#ffffff"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#eef0ff" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="52" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 90 q55 30 110 0 q-10 20 -55 22 q-45 -2 -55 -22z" fill="url(#istiridye)"/>
    <path d="M10 90 q0 -60 55 -70 q55 10 55 70 q-55 -14 -110 0z" fill="url(#istiridye)"/>
    <path d="M30 80 q4 -30 20 -48 M65 78 v-56 M100 80 q-4 -30 -20 -48" fill="none" stroke-width="2.5"/>
    <circle cx="65" cy="92" r="14" fill="url(#inci)"/>
    <path d="M58 86 q4 -4 8 -4" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
