<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Nine (gözlüklü, topuzlu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="144" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="116" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 116 q0 -40 39 -42 q39 2 39 42z" fill="url(#mor)"/>
    <circle cx="65" cy="14" r="12" fill="url(#gri)"/>
    <circle cx="65" cy="46" r="28" fill="url(#pembe)"/>
    <path d="M37 42 q2 -26 28 -26 q26 0 28 26 q-10 -12 -28 -12 q-18 0 -28 12z" fill="url(#gri)"/>
    <circle cx="54" cy="48" r="8" fill="#ffffff" fill-opacity="0.6" stroke-width="3"/>
    <circle cx="76" cy="48" r="8" fill="#ffffff" fill-opacity="0.6" stroke-width="3"/>
    <path d="M62 48 h6" fill="none" stroke-width="3"/>
    <circle cx="54" cy="48" r="2.5" fill="#2b2b2b"/><circle cx="76" cy="48" r="2.5" fill="#2b2b2b"/>
    <path d="M56 62 q9 7 18 0" fill="none" stroke-width="3"/>
  </g>
</svg>
