<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- İnek: i harfinin ipucu resmi (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="53" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 20 q-14 -4 -18 -16 q12 0 22 8 M102 20 q14 -4 18 -16 q-12 0 -22 8" fill="#fff6dc"/>
    <path d="M30 30 q-24 -6 -26 8 q8 10 26 6z M100 30 q24 -6 26 8 q-8 10 -26 6z" fill="#ffffff"/>
    <path d="M30 22 q35 -16 70 0 q8 30 0 58 q-35 12 -70 0 q-8 -28 0 -58z" fill="#ffffff"/>
    <path d="M38 26 q12 -4 16 8 q-6 12 -18 6 q-4 -8 2 -14z M84 52 q12 -2 12 10 q-8 8 -16 2 q-2 -8 4 -12z" fill="#2b2b2b" stroke-width="2"/>
    <path d="M32 72 q33 -14 66 0 q6 36 -33 36 q-39 0 -33 -36z" fill="url(#pembe)"/>
    <ellipse cx="52" cy="88" rx="5" ry="7" fill="#2b2b2b" stroke-width="2"/>
    <ellipse cx="78" cy="88" rx="5" ry="7" fill="#2b2b2b" stroke-width="2"/>
    <circle cx="48" cy="52" r="4" fill="#2b2b2b"/>
    <circle cx="74" cy="44" r="4" fill="#2b2b2b"/>
  </g>
</svg>
