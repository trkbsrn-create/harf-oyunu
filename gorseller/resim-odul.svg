<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ödül (kupa) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="345" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="116" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 14 h58 v20 q0 30 -29 34 q-29 -4 -29 -34z" fill="url(#sari)"/>
    <path d="M36 22 q-20 0 -18 16 q2 14 22 16 M94 22 q20 0 18 16 q-2 14 -22 16" fill="none" stroke-width="5"/>
    <path d="M58 68 h14 v20 h-14z" fill="url(#sari)" stroke-width="3"/>
    <path d="M40 88 h50 v16 h-50z" fill="#b07a42"/>
    <path d="M65 26 l4 8 l8 1 l-6 5 l2 8 l-8 -4 l-8 4 l2 -8 l-6 -5 l8 -1z" fill="#ffffff" stroke-width="2"/>
  </g>
</svg>
