<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Civciv (yumurtadan çıkmış) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="214" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kabuk3" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ecebe2" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="44" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="65" cy="62" r="34" fill="url(#sari)"/>
    <path d="M60 28 q4 -12 10 -4 q4 -10 8 0" fill="none" stroke-width="3"/>
    <circle cx="54" cy="56" r="3.5" fill="#2b2b2b"/><circle cx="76" cy="56" r="3.5" fill="#2b2b2b"/>
    <path d="M58 66 l7 8 l7 -8z" fill="#f08a3c" stroke-width="2.5"/>
    <path d="M28 80 l10 -8 l8 8 l10 -8 l9 8 l9 -8 l10 8 l8 -8 l10 8 q-4 34 -37 34 q-33 0 -37 -34z" fill="url(#kabuk3)"/>
  </g>
</svg>
