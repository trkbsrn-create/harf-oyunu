<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Bilezik (boncuklu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="233" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="65" cy="62" rx="50" ry="42" fill="none" stroke-width="16"/>
    <ellipse cx="65" cy="62" rx="50" ry="42" fill="none" stroke="#ffe680" stroke-width="9"/>
    <circle cx="65" cy="20" r="8" fill="#ff9c8a" stroke-width="3"/><circle cx="20" cy="56" r="8" fill="#9be3dc" stroke-width="3"/>
    <circle cx="110" cy="56" r="8" fill="#c8a2ff" stroke-width="3"/><circle cx="40" cy="96" r="8" fill="#b5e48c" stroke-width="3"/><circle cx="90" cy="96" r="8" fill="#ff9c8a" stroke-width="3"/>
  </g>
</svg>
