<svg xmlns="http://www.w3.org/2000/svg" width="260" height="160" viewBox="0 0 260 160">
  <!-- Market zeplini (çizgili gövde, kanatçıklar, altında tabela kabini) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="907" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="zeplin" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="22" height="22" fill="#ffd2c8"/>
      <line x1="0" y1="11.0" x2="22" y2="11.0" stroke="#ff9c8a" stroke-width="11" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M28 52 l-22 -26 l30 8z M28 78 l-22 26 l30 -8z" fill="#9be3dc"/>
    <ellipse cx="128" cy="65" rx="102" ry="46" fill="url(#zeplin)"/>
    <path d="M60 30 q-6 35 0 70 M196 30 q6 35 0 70" fill="none" stroke-width="2.5"/>
    <path d="M210 52 q12 13 0 26" fill="none" stroke-width="2.5"/>
    <path d="M92 108 l8 10 M164 108 l-8 10" fill="none" stroke-width="3"/>
    <rect x="80" y="116" width="100" height="34" rx="10" fill="#fbf4e2"/>
    <circle cx="96" cy="44" r="7" fill="#ffffff" stroke="none" opacity="0.8"/>
  </g>
</svg>
