<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Köpek (oturan, sarkık kulaklı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="348" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kopekAcik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 112 q-10 -40 25 -44 q35 4 25 44z" fill="url(#kopekAcik)"/>
    <ellipse cx="65" cy="46" rx="30" ry="28" fill="url(#kopekAcik)"/>
    <path d="M38 30 q-18 6 -14 34 q10 0 16 -16z M92 30 q18 6 14 34 q-10 0 -16 -16z" fill="url(#kahve)"/>
    <circle cx="55" cy="42" r="3.5" fill="#2b2b2b"/><circle cx="75" cy="42" r="3.5" fill="#2b2b2b"/>
    <ellipse cx="65" cy="56" rx="7" ry="5" fill="#2b2b2b"/>
    <path d="M58 64 q7 6 14 0" fill="none" stroke-width="3"/><path d="M64 66 q2 8 6 6" fill="#ff9c8a" stroke-width="2"/>
  </g>
</svg>
