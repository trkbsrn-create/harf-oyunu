<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Simit (susamlı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="341" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="simit" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#e3a86b"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c27c3a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="108" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="65" cy="62" rx="50" ry="40" fill="url(#simit)"/>
    <ellipse cx="65" cy="62" rx="20" ry="14" fill="#fbf7ec"/>
    <path d="M30 40 l4 2 M50 30 l4 2 M84 32 l4 -2 M100 48 l4 2 M96 82 l4 -2 M72 92 l4 2 M40 86 l4 -2 M24 64 l4 2" fill="none" stroke="#fff6e0" stroke-width="3"/>
  </g>
</svg>
