<svg xmlns="http://www.w3.org/2000/svg" width="40" height="56" viewBox="0 0 40 56">
  <!-- Çiçek (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="23" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tac" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="5" height="5" fill="#ffffff"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#e3e3e3" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 54 q-3 -14 0 -30" fill="none" stroke-width="3"/>
    <path d="M19 44 q-10 -2 -12 -10 q9 0 12 8" fill="#8fd16a" stroke-width="2.5"/>
    <path d="M20 4 q6 0 6 6 q6 -2 8 4 q2 6 -4 8 q4 6 -2 10 q-6 2 -8 -4 q-2 6 -8 4 q-6 -4 -2 -10 q-6 -2 -4 -8 q2 -6 8 -4 q0 -6 6 -6z" fill="url(#tac)" stroke-width="3"/>
    <circle cx="20" cy="18" r="5" fill="url(#sari)" stroke-width="2.5"/>
  </g>
</svg>
