<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kuğu (beyaz, uzun boyunlu, suda) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="516" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 98 q32 -8 64 0 q32 8 66 0 v22 h-130z" fill="url(#mavi)"/>
    <path d="M20 84 q10 -30 50 -24 q40 -2 46 -20 q4 30 -14 50 q-20 12 -60 10 q-22 -2 -22 -16z" fill="#ffffff"/>
    <path d="M40 66 q-14 -30 -2 -48 q10 -14 22 -4" fill="none" stroke="#2b2b2b" stroke-width="13"/>
    <path d="M40 66 q-14 -30 -2 -48 q10 -14 22 -4" fill="none" stroke="#ffffff" stroke-width="8"/>
    <path d="M58 12 l12 6 l-12 4z" fill="#f08a3c" stroke-width="2"/>
    <circle cx="52" cy="14" r="2.2" fill="#2b2b2b" stroke="none"/>
    <path d="M58 76 q20 10 40 -4" fill="none" stroke-width="2.5"/>
  </g>
</svg>
