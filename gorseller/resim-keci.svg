<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Keçi (sakallı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="208" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="beyaz" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e6e6e6" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="68" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M52 80 v32 M64 82 v30 M96 82 v30 M108 80 v32" fill="none" stroke-width="5"/>
    <path d="M44 62 q4 -14 40 -14 q34 0 32 20 q-2 18 -34 18 q-40 0 -38 -24z" fill="url(#beyaz)"/>
    <path d="M30 24 q-6 -16 -18 -16 M38 22 q4 -16 16 -18" fill="none" stroke="#a9a59c" stroke-width="5"/>
    <path d="M48 66 q-8 -20 -12 -34 l-10 4 q4 18 10 34z" fill="url(#beyaz)"/>
    <path d="M18 30 q4 -12 20 -8 q12 6 8 18 q-6 14 -20 12 q-12 -4 -8 -22z" fill="url(#beyaz)"/>
    <path d="M22 50 q-2 14 6 18 q4 -12 2 -18" fill="url(#gri)" stroke-width="2.5"/>
    <circle cx="30" cy="34" r="2.6" fill="#2b2b2b"/>
  </g>
</svg>
