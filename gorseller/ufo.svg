<svg xmlns="http://www.w3.org/2000/svg" width="80" height="50" viewBox="0 0 80 50">
  <!-- Uçan daire (UFO; geçip gider) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="713" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ufo" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#e3e1ea"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#b9b5c6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 22 q0 -18 14 -18 q14 0 14 18z" fill="#c9f1ff" stroke-width="3"/>
    <ellipse cx="40" cy="28" rx="36" ry="11" fill="url(#ufo)"/>
    <circle cx="20" cy="29" r="3" fill="#ffe680" stroke-width="1.5"/><circle cx="40" cy="32" r="3" fill="#ff7f6a" stroke-width="1.5"/><circle cx="60" cy="29" r="3" fill="#9ff0c8" stroke-width="1.5"/>
  </g>
</svg>
