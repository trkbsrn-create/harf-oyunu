<svg xmlns="http://www.w3.org/2000/svg" width="80" height="130" viewBox="0 0 80 130">
  <!-- Harf balonu (oyunda boyanır) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="81" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="balonTarama" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e3e3e3" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
    <path d="M40 84 q-8 16 4 26 q10 10 -2 20" fill="none" stroke="#2b2b2b" stroke-width="2.5"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="40" cy="42" rx="34" ry="40" fill="url(#balonTarama)"/>
    <path d="M34 82 h12 l-6 7z" fill="#ffffff" stroke-width="2.5"/>
    <path d="M22 22 q6 -10 16 -12" fill="none" stroke="#ffffff" stroke-width="6"/>
  </g>
</svg>
