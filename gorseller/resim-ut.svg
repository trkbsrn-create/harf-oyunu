<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ut (armut gövdeli telli çalgı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="277" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="utacik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="60" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M84 50 l30 -36 l8 6 l-30 36z" fill="url(#kahve)"/>
    <path d="M112 18 l12 -6 l-2 14z" fill="url(#kahve)"/>
    <path d="M90 58 q-4 -20 -32 -18 q-40 4 -44 40 q-2 28 28 32 q36 4 46 -28 q4 -14 2 -26z" fill="url(#utacik)"/>
    <circle cx="58" cy="76" r="10" fill="#b07a42" stroke-width="3"/>
    <path d="M36 98 l70 -78 M40 102 l70 -78" fill="none" stroke-width="1.5"/>
    <path d="M30 90 l14 14" fill="none" stroke-width="5"/>
  </g>
</svg>
