<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Jip (üstü açık arazi aracı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="501" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="haki" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#b9c99a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7f9a5a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="56" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 82 v-26 h30 l12 -22 h6 l-6 22 h66 v26z" fill="url(#haki)"/>
    <path d="M44 56 l10 -20" fill="none" stroke-width="3"/>
    <path d="M114 50 v-14 h-10 v14" fill="none" stroke-width="4"/>
    <circle cx="34" cy="88" r="17" fill="#2b2b2b"/><circle cx="96" cy="88" r="17" fill="#2b2b2b"/>
    <circle cx="34" cy="88" r="7" fill="url(#gri)" stroke-width="2"/><circle cx="96" cy="88" r="7" fill="url(#gri)" stroke-width="2"/>
    <circle cx="12" cy="64" r="4" fill="#ffe680" stroke-width="2"/>
    <path d="M60 64 h16" fill="none" stroke-width="3"/>
  </g>
</svg>
