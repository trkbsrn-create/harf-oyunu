<svg xmlns="http://www.w3.org/2000/svg" width="90" height="110" viewBox="0 0 90 110">
  <!-- Gösteren el (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="85" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="ten" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffe2c6"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f5c9a0" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M22 50 V18 q0 -12 10 -12 q10 0 10 12 V46
      q4 -8 11 -6 q7 2 6 10 q5 -7 11 -4 q6 3 5 11 q6 -4 10 1 q4 5 2 14 V78
      q0 26 -28 28 h-10 q-20 0 -28 -18 l-14 -28 q-4 -10 4 -13 q8 -3 13 6 z" fill="url(#ten)"/>
    <path d="M53 50 v10 M70 58 v8" fill="none" stroke-width="2.5"/>
  </g>
</svg>
