<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Yunus (sudan zıplayan) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="330" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yunusGri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bcd7e6"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#8fb5cc" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 100 q30 -12 60 0 q30 12 56 0" fill="none" stroke="#7cc3e6" stroke-width="5"/>
    <path d="M18 92 q10 -60 66 -66 q20 -2 30 6 q-8 4 -10 10 q-6 30 -34 44 l6 14 l-18 -10 q-20 4 -40 2z" fill="url(#yunusGri)"/>
    <path d="M60 30 l-8 -16 l18 10" fill="url(#yunusGri)" stroke-width="3"/>
    <path d="M18 92 l-12 -4 l4 14z" fill="url(#yunusGri)" stroke-width="3"/>
    <circle cx="92" cy="36" r="3" fill="#2b2b2b"/><path d="M98 46 q6 2 12 -2" fill="none" stroke-width="2.5"/>
  </g>
</svg>
