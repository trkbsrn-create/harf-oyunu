<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Pil (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="215" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pil" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="8" height="8" fill="#ffc58f"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="30" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 8 h18 v10 h-18z" fill="url(#gri)"/>
    <path d="M44 18 h42 v92 h-42z" fill="url(#pil)"/>
    <path d="M44 18 h42 v34 h-42z" fill="#5a5a5a"/>
    <path d="M65 26 v16 M57 34 h16" fill="none" stroke="#ffffff" stroke-width="4"/>
  </g>
</svg>
