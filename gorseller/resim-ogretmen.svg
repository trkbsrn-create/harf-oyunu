<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Öğretmen (tahta önünde, işaret çubuklu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="518" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="116" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 8 h84 v58 h-84z" fill="#3f6b4a"/>
    <path d="M52 26 h22 M52 40 h34 M52 54 h16" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M14 114 l6 -44 q2 -10 16 -10 q14 0 16 10 l6 44z" fill="url(#mor)"/>
    <path d="M48 76 l28 -30" fill="none" stroke="#8e6340" stroke-width="4"/>
    <circle cx="36" cy="42" r="15" fill="#ffe2c6"/>
    <path d="M20 44 q-2 -24 16 -24 q18 0 16 24 q-4 -12 -16 -12 q-12 0 -16 12z" fill="#5a3b2a"/>
    <circle cx="31" cy="44" r="2" fill="#2b2b2b"/><circle cx="41" cy="44" r="2" fill="#2b2b2b"/>
    <path d="M32 51 q4 4 8 0" fill="none" stroke-width="2"/>
  </g>
</svg>
