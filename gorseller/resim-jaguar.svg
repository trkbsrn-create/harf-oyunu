      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="112" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M26 104 v-20 M40 104 v-20 M84 104 v-20 M98 104 v-20" fill="none" stroke-width="7"/>
    <path d="M26 104 v-20 M40 104 v-20 M84 104 v-20 M98 104 v-20" fill="none" stroke="#ffc928" stroke-width="3"/>
    <path d="M108 70 q20 -4 16 -30" fill="none" stroke-width="6"/>
