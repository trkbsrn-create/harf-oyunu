<svg xmlns="http://www.w3.org/2000/svg" width="120" height="120" viewBox="0 0 120 120">
  <!-- İksir parçasının çanta simgesi: ogrenme (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="722" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="cam" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#e8f6ff"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c9e6f5" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="merak" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#fff6c4"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffe680" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="cesaret" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffb08a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f0705a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="sabir" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c6b0f0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#9a7fe0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kesif" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#c9f1ff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7fd6f0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="basari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f0b84a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <g transform="translate(5 5)"><path d="M20 94 l35 -80 l35 80 M34 64 h42" fill="none" stroke="#ffe680" stroke-width="3" stroke-dasharray="5 6"/><path d="M20.0 85.0 L22.4 90.7 L28.6 91.2 L23.9 95.3 L25.3 101.3 L20.0 98.0 L14.7 101.3 L16.1 95.3 L11.4 91.2 L17.6 90.7z" fill="url(#merak)" stroke-width="2"/><path d="M55.0 5.0 L57.4 10.7 L63.6 11.2 L58.9 15.3 L60.3 21.3 L55.0 18.1 L49.7 21.3 L51.1 15.3 L46.4 11.2 L52.6 10.7z" fill="url(#merak)" stroke-width="2"/><path d="M90.0 85.0 L92.4 90.7 L98.6 91.2 L93.9 95.3 L95.3 101.3 L90.0 98.0 L84.7 101.3 L86.1 95.3 L81.4 91.2 L87.6 90.7z" fill="url(#merak)" stroke-width="2"/><path d="M34.0 55.0 L36.4 60.7 L42.6 61.2 L37.9 65.3 L39.3 71.3 L34.0 68.0 L28.7 71.3 L30.1 65.3 L25.4 61.2 L31.6 60.7z" fill="url(#merak)" stroke-width="2"/><path d="M76.0 55.0 L78.4 60.7 L84.6 61.2 L79.9 65.3 L81.3 71.3 L76.0 68.0 L70.7 71.3 L72.1 65.3 L67.4 61.2 L73.6 60.7z" fill="url(#merak)" stroke-width="2"/></g>
  </g>
</svg>
