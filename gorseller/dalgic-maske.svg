<svg xmlns="http://www.w3.org/2000/svg" width="680" height="440" viewBox="0 0 680 440">
  <!-- Dalgıç parçası: maske (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="420" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="elbise" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#5d8fb3"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#3f6f94" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="maske" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="tup" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="palet" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#9be3dc"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#4fc3b8" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="7" height="7" fill="#e3b77e"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M150 82 q0 -12 14 -12 h52 q14 0 14 12 v22 q0 12 -14 12 h-14 l-6 -8 h-12 l-6 8 h-14 q-14 0 -14 -12z" fill="url(#maske)"/>
  </g>
</svg>
