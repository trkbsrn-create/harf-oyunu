<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Nergis (çiçek) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="145" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="turuncu" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffc58f"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f08a3c" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 116 v-56" fill="none" stroke="#6fbf4a" stroke-width="6"/>
    <path d="M64 112 q-30 -20 -34 -54 q20 18 34 40z M64 112 q30 -20 34 -54 q-20 18 -34 40z" fill="url(#yesil)"/>
    <path d="M64 40 l10 -28 l8 30 l28 -6 l-22 18 l22 18 l-28 -6 l-8 30 l-10 -28 l-10 28 l-8 -30 l-28 6 l22 -18 l-22 -18 l28 6 l8 -30z" fill="url(#sari)"/>
    <circle cx="64" cy="48" r="13" fill="url(#turuncu)"/>
    <circle cx="64" cy="48" r="6" fill="#ffe680" stroke-width="2.5"/>
  </g>
</svg>
