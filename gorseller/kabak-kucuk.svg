<svg xmlns="http://www.w3.org/2000/svg" width="48" height="40" viewBox="0 0 48 40">
  <!-- Bal kabağı (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="307" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="24" cy="26" rx="20" ry="13" fill="url(#turuncu)" stroke-width="3"/>
    <path d="M15 15 q-4 11 0 22 M33 15 q4 11 0 22" fill="none" stroke-width="2"/>
    <path d="M24 14 q2 -8 7 -10" fill="none" stroke="#5f9e3c" stroke-width="4"/>
  </g>
</svg>
