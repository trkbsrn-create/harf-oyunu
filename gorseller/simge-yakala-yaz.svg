<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Yakala ve Yaz (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="221" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#e3b77e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#d8c2f3"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M58 42 l34 52" fill="none" stroke="#c98f4f" stroke-width="8"/>
    <path d="M58 42 l34 52" fill="none" stroke-width="2.5"/>
    <ellipse cx="38" cy="30" rx="30" ry="22" fill="#fffdf6"/>
    <path d="M14 36 q14 40 28 36 q12 -4 22 -30" fill="#fffdf6" stroke-width="3"/>
    <path d="M22 32 l30 34 M36 26 l18 30 M50 22 l-28 40 M30 22 l-12 22" fill="none" stroke="#b9b5ac" stroke-width="2"/>
    <path d="M78 16 q-8 -8 -6 4 q-6 -10 -8 2 q4 6 10 2 q8 4 4 -8" fill="url(#mor)" stroke-width="2.5"/>
  </g>
</svg>
