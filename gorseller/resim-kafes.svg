<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kuş kafesi (içinde sarı kuş) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="466" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 6 v8" fill="none" stroke-width="3"/><circle cx="65" cy="6" r="4" fill="none" stroke-width="3"/>
    <path d="M24 108 v-62 q0 -32 41 -32 q41 0 41 32 v62z" fill="#fbf7ec"/>
    <path d="M38 108 v-72 M52 108 v-90 M65 108 v-94 M78 108 v-90 M92 108 v-72" fill="none" stroke-width="2"/>
    <path d="M18 104 h94 v10 h-94z" fill="#b07a42"/>
    <ellipse cx="64" cy="74" rx="14" ry="12" fill="url(#sari)" stroke-width="2.5"/>
    <circle cx="72" cy="64" r="2" fill="#2b2b2b"/><path d="M78 66 l6 2 l-6 2z" fill="#f08a3c" stroke-width="1.5"/>
  </g>
</svg>
