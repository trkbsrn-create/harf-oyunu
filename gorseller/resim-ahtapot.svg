<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ahtapot (mor, gülen) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="801" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 70 q-20 16 -24 38 M48 76 q-8 20 -4 36 M65 78 v34 M82 76 q8 20 4 36 M96 70 q20 16 24 38" fill="none" stroke="#2b2b2b" stroke-width="13"/>
    <path d="M34 70 q-20 16 -24 38 M48 76 q-8 20 -4 36 M65 78 v34 M82 76 q8 20 4 36 M96 70 q20 16 24 38" fill="none" stroke="#c4a3ec" stroke-width="8"/>
    <path d="M22 64 q-6 -58 43 -58 q49 0 43 58 q-43 20 -86 0z" fill="url(#mor)"/>
    <circle cx="50" cy="44" r="5" fill="#2b2b2b"/><circle cx="80" cy="44" r="5" fill="#2b2b2b"/>
    <path d="M54 58 q11 8 22 0" fill="none" stroke-width="3"/>
  </g>
</svg>
