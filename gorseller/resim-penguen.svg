<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Penguen (önden) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="440" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="30" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="65" cy="66" rx="34" ry="46" fill="#2b2b2b"/>
    <ellipse cx="65" cy="76" rx="22" ry="34" fill="#ffffff" stroke="none"/>
    <path d="M32 56 q-14 20 -6 40 M98 56 q14 20 6 40" fill="none" stroke-width="7"/>
    <circle cx="55" cy="38" r="5" fill="#ffffff" stroke="none"/><circle cx="75" cy="38" r="5" fill="#ffffff" stroke="none"/>
    <circle cx="55" cy="38" r="2.5" fill="#2b2b2b" stroke="none"/><circle cx="75" cy="38" r="2.5" fill="#2b2b2b" stroke="none"/>
    <path d="M58 48 h14 l-7 10z" fill="url(#sari)" stroke-width="2"/>
    <path d="M48 110 h14 M68 110 h14" fill="none" stroke="#ffc928" stroke-width="6"/>
  </g>
</svg>
