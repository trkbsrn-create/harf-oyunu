<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Flamingo (tek ayak üstünde) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="270" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="62" cy="114" rx="26" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M62 82 v32 M62 96 l-12 -10 l-4 8" fill="none" stroke="#e0533d" stroke-width="4"/>
    <path d="M30 60 q8 -22 36 -18 q30 4 30 22 q-6 22 -34 22 q-28 0 -32 -26z" fill="url(#pembe)"/>
    <path d="M86 50 q8 -24 -6 -34 q-12 -6 -14 6" fill="none" stroke="#ff9c8a" stroke-width="9"/>
    <path d="M86 50 q8 -24 -6 -34 q-12 -6 -14 6" fill="none" stroke-width="2"/>
    <circle cx="70" cy="18" r="9" fill="url(#pembe)"/><circle cx="72" cy="16" r="2.5" fill="#2b2b2b"/>
    <path d="M62 20 q-10 4 -8 14 q2 -6 8 -8z" fill="#2b2b2b" stroke-width="2"/>
    <path d="M44 62 q12 -8 26 0" fill="none" stroke-width="3"/>
  </g>
</svg>
