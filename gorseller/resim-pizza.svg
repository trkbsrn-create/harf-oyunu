<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Pizza (dilimli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="251" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="hamur" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#f7d08a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#d99a4e" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="peynir" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#fff1a8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffd84a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="65" cy="62" r="52" fill="url(#hamur)"/>
    <circle cx="65" cy="62" r="42" fill="url(#peynir)"/>
    <path d="M65 20 v84 M23 62 h84 M35 32 l60 60 M95 32 l-60 60" fill="none" stroke-width="2.5"/>
    <circle cx="48" cy="44" r="7" fill="#e0533d" stroke-width="2.5"/><circle cx="84" cy="50" r="7" fill="#e0533d" stroke-width="2.5"/>
    <circle cx="52" cy="80" r="7" fill="#e0533d" stroke-width="2.5"/><circle cx="82" cy="80" r="7" fill="#e0533d" stroke-width="2.5"/>
    <circle cx="66" cy="62" r="4" fill="#6fbf4a" stroke-width="2"/>
  </g>
</svg>
