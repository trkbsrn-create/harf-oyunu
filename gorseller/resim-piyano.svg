<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Piyano (kuyruklu değil, duvar piyanosu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="267" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="56" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 20 h106 v86 h-106z" fill="url(#kahve)"/>
    <path d="M12 58 h106 v22 h-106z" fill="#ffffff"/>
    <path d="M27 58 v22 M42 58 v22 M57 58 v22 M72 58 v22 M87 58 v22 M102 58 v22" fill="none" stroke-width="2.5"/>
    <path d="M23 58 h8 v13 h-8z M38 58 h8 v13 h-8z M68 58 h8 v13 h-8z M83 58 h8 v13 h-8z M98 58 h8 v13 h-8z" fill="#2b2b2b" stroke-width="1"/>
    <path d="M20 106 v8 M110 106 v8" fill="none" stroke-width="5"/>
    <path d="M46 30 h38 v18 h-38z" fill="#fff6e0" stroke-width="3"/>
    <path d="M54 36 v8 M62 34 v10 M72 38 v6" fill="none" stroke-width="2"/>
  </g>
</svg>
