<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Ceviz (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="177" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="ic" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="44" cy="66" rx="30" ry="36" fill="url(#kahve)"/>
    <path d="M44 30 q-8 36 0 72" fill="none" stroke-width="3"/>
    <path d="M30 50 q4 4 0 10 q-4 6 0 12 M56 46 q-4 6 0 12 q4 6 0 14" fill="none" stroke-width="2.5"/>
    <path d="M78 74 q0 -26 22 -26 q22 0 22 26 q0 26 -22 26 q-22 0 -22 -26z" fill="url(#kahve)"/>
    <path d="M84 74 q4 -16 16 -18 q12 2 16 18 q-4 16 -16 18 q-12 -2 -16 -18z" fill="url(#ic)" stroke-width="2.5"/>
  </g>
</svg>
