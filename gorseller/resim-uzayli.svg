<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Uzaylı (yeşil, antenli, tek gözlü değil) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="278" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mor" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#d8c2f3"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a77be0" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M48 24 l-10 -16 M82 24 l10 -16" fill="none" stroke-width="3.5"/>
    <circle cx="38" cy="8" r="5" fill="url(#mor)" stroke-width="3"/><circle cx="92" cy="8" r="5" fill="url(#mor)" stroke-width="3"/>
    <path d="M46 78 q-14 0 -14 18 v14 h66 v-14 q0 -18 -14 -18z" fill="url(#mor)"/>
    <ellipse cx="65" cy="50" rx="36" ry="32" fill="url(#yesil)"/>
    <ellipse cx="51" cy="48" rx="9" ry="12" fill="#ffffff" stroke-width="3"/><ellipse cx="79" cy="48" rx="9" ry="12" fill="#ffffff" stroke-width="3"/>
    <circle cx="53" cy="50" r="4" fill="#2b2b2b"/><circle cx="81" cy="50" r="4" fill="#2b2b2b"/>
    <path d="M54 68 q11 8 22 0" fill="none" stroke-width="3"/>
  </g>
</svg>
