<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Japon balığı (fanusta, turuncu) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="500" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="116" rx="40" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 14 h70 q24 24 24 52 q0 46 -59 46 q-59 0 -59 -46 q0 -28 24 -52z" fill="url(#mavi)"/>
    <path d="M30 14 h70" fill="none" stroke-width="5"/>
    <path d="M84 62 l22 -16 q-4 16 0 32z" fill="url(#turuncu)"/>
    <path d="M30 62 q20 -26 54 0 q-34 26 -54 0z" fill="url(#turuncu)"/>
    <path d="M52 44 q6 -10 14 -2 M52 80 q6 8 12 2" fill="url(#turuncu)" stroke-width="2.5"/>
    <circle cx="42" cy="58" r="3" fill="#2b2b2b"/>
    <circle cx="28" cy="40" r="3" fill="none" stroke-width="2"/><circle cx="22" cy="28" r="2" fill="none" stroke-width="2"/>
    <path d="M10 100 q55 14 110 0" fill="none" stroke="#6fbf4a" stroke-width="3"/>
  </g>
</svg>
