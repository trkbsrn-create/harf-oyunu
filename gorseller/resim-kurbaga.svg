<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kurbağa (önden, oturan) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="128" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M16 110 q-6 -20 16 -24 M114 110 q6 -20 -16 -24" fill="url(#yesil)"/>
    <ellipse cx="65" cy="76" rx="48" ry="34" fill="url(#yesil)"/>
    <circle cx="40" cy="34" r="17" fill="url(#yesil)"/>
    <circle cx="90" cy="34" r="17" fill="url(#yesil)"/>
    <circle cx="40" cy="34" r="9" fill="#ffffff" stroke-width="3"/>
    <circle cx="90" cy="34" r="9" fill="#ffffff" stroke-width="3"/>
    <circle cx="42" cy="35" r="4" fill="#2b2b2b"/>
    <circle cx="88" cy="35" r="4" fill="#2b2b2b"/>
    <path d="M36 70 q29 22 58 0" fill="none" stroke-width="4"/>
    <ellipse cx="65" cy="96" rx="24" ry="10" fill="#e6f6d0" stroke-width="3"/>
  </g>
</svg>
