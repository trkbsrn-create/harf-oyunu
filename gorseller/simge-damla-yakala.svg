<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Damla Yakalama (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="201" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="su" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9ecff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc4ef" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 8 q30 40 30 58 a30 30 0 0 1 -60 0 q0 -18 30 -58z" fill="url(#su)"/>
    <circle cx="46" cy="66" r="11" fill="none" stroke="#2b2b2b" stroke-width="5"/>
    <path d="M57 55 v24" fill="none" stroke="#2b2b2b" stroke-width="5"/>
    <path d="M14 30 v14 M86 30 v14" fill="none" stroke="#7cc4ef" stroke-width="4"/>
  </g>
</svg>
