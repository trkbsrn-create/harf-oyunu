<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Istakoz (kırmızı, iki büyük kıskaç) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="288" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="30" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M50 30 l-14 -16 M80 30 l14 -16" fill="none" stroke-width="2.5"/>
    <path d="M52 44 q-20 0 -30 -12 M78 44 q20 0 30 -12" fill="none" stroke-width="5"/>
    <path d="M22 32 q-16 -6 -14 -20 q8 2 14 10 q2 -12 12 -14 q4 14 -12 24z" fill="url(#kirmizi)"/>
    <path d="M108 32 q16 -6 14 -20 q-8 2 -14 10 q-2 -12 -12 -14 q-4 14 12 24z" fill="url(#kirmizi)"/>
    <path d="M50 54 l-16 10 M50 64 l-16 12 M80 54 l16 10 M80 64 l16 12" fill="none" stroke-width="3"/>
    <path d="M65 26 q16 0 16 22 q0 24 -6 44 h-20 q-6 -20 -6 -44 q0 -22 16 -22z" fill="url(#kirmizi)"/>
    <path d="M51 60 h28 M53 74 h24" fill="none" stroke-width="2.5"/>
    <path d="M55 92 l-14 18 h48 l-14 -18z" fill="url(#kirmizi)"/>
    <circle cx="59" cy="34" r="3" fill="#2b2b2b"/><circle cx="71" cy="34" r="3" fill="#2b2b2b"/>
  </g>
</svg>
