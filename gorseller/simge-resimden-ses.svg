<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Resimden Sesi Bul (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="204" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kirmizi" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ff9c8a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e0533d" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="tahta" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(80)">
      <rect width="6" height="6" fill="#e3b77e"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#c98f4f" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="10" y="12" width="80" height="76" rx="8" fill="url(#tahta)"/>
    <rect x="20" y="22" width="60" height="56" rx="4" fill="#fffdf6" stroke-width="3"/>
    <path d="M50 36 q-2 -8 4 -12" fill="none" stroke-width="3.5"/>
    <path d="M50 38 q-8 -6 -16 -2 q-12 6 -8 20 q4 16 14 18 q6 2 10 -2 q4 4 10 2 q10 -2 14 -18 q4 -14 -8 -20 q-8 -4 -16 2z" fill="url(#kirmizi)" stroke-width="3"/>
  </g>
</svg>
