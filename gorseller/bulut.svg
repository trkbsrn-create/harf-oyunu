<svg xmlns="http://www.w3.org/2000/svg" width="220" height="110" viewBox="0 0 220 110">
  <!-- Gökyüzünde süzülen bulut (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="76" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gok" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="8" height="8" fill="#ffffff"/>
      <line x1="0" y1="4.0" x2="8" y2="4.0" stroke="#e3f2fc" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 96 q-26 -2 -22 -26 q2 -22 28 -20 q4 -30 40 -30 q22 -22 54 -6 q30 -10 44 18 q30 0 32 30 q2 32 -30 34z" fill="url(#gok)"/>
  </g>
</svg>
