<svg xmlns="http://www.w3.org/2000/svg" width="110" height="96" viewBox="0 0 110 96">
  <!-- Açık hazine sandığı, doodle tarzı (kendi çizimimiz) -->
  <defs>
    <!-- Kalem titremesi: çizgileri hafifçe büker, elle çizilmiş gibi gösterir -->
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="5" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="tahta" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#efc08d"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#d8945a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kapak" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(40)">
      <rect width="7" height="7" fill="#e3a868"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#c47d3e" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="altin" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="55" cy="90" rx="46" ry="5" fill="#000" fill-opacity="0.15"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- arkaya devrilmiş kapak (iç yüzü görünür) -->
    <path d="M16 40 l10 -32 h58 l10 32 z" fill="url(#kapak)"/>
    <path d="M38 8 l-4 32 M72 8 l4 32" fill="none" stroke-width="3"/>
    <!-- sandığın karanlık içi -->
    <path d="M14 40 h82 l-4 12 h-74 z" fill="#5a3a22"/>
    <!-- ağzından taşan altınlar -->
    <path d="M20 48 q4 -14 12 -10 q4 -12 12 -6 q6 -12 14 -4 q6 -10 14 -2 q8 -8 12 4 q6 0 6 18 z" fill="url(#altin)"/>
    <circle cx="36" cy="40" r="5" fill="#ffd84d" stroke-width="2.5"/>
    <circle cx="70" cy="38" r="5" fill="#ffd84d" stroke-width="2.5"/>
    <!-- gövde -->
    <rect x="12" y="50" width="86" height="36" rx="5" fill="url(#tahta)"/>
    <path d="M14 68 h14 M82 68 h14 M14 78 h14 M82 78 h14" fill="none" stroke-width="2.5"/>
    <path d="M28 50 v36 M82 50 v36" fill="none" stroke-width="3"/>
    <rect x="44" y="50" width="22" height="16" rx="4" fill="url(#altin)"/>
  </g>
  <!-- parıltılar -->
  <g filter="url(#titrek)" stroke="#f4b400" stroke-width="3" stroke-linecap="round">
    <path d="M55 6 v-4 M20 20 l-6 -4 M92 20 l6 -4"/>
  </g>
</svg>
