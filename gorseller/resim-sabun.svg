<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Sabun (köpüklü kalıp) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="450" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="108" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 64 q0 -14 14 -14 h66 q14 0 14 14 v28 q0 14 -14 14 h-66 q-14 0 -14 -14z" fill="url(#pembe)"/>
    <path d="M34 66 q30 -10 60 0" fill="none" stroke="#ffffff" stroke-width="5"/>
    <circle cx="40" cy="38" r="12" fill="#eef8ff" stroke-width="2.5"/><circle cx="64" cy="28" r="15" fill="#eef8ff" stroke-width="2.5"/><circle cx="90" cy="38" r="10" fill="#eef8ff" stroke-width="2.5"/>
    <circle cx="104" cy="20" r="6" fill="#eef8ff" stroke-width="2"/>
  </g>
</svg>
