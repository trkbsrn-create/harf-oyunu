<svg xmlns="http://www.w3.org/2000/svg" width="70" height="70" viewBox="0 0 70 70">
  <!-- Sincap (oturan, palamut tutuyor) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="310" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ffc58f"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="32" cy="66" rx="22" ry="4" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M36 64 q30 -4 26 -36 q-2 -22 -20 -20 q12 12 2 26 q-8 12 -16 14z" fill="url(#turuncu)" stroke-width="3"/>
    <ellipse cx="26" cy="50" rx="13" ry="15" fill="url(#turuncu)" stroke-width="3"/>
    <circle cx="22" cy="28" r="11" fill="url(#turuncu)" stroke-width="3"/>
    <path d="M14 20 l-3 -9 l7 5 M22 18 l1 -9 l4 7" fill="url(#turuncu)" stroke-width="2.5"/>
    <circle cx="18" cy="27" r="2" fill="#2b2b2b" stroke="none"/><circle cx="12" cy="31" r="1.6" fill="#2b2b2b" stroke="none"/>
    <ellipse cx="15" cy="46" rx="5" ry="6" fill="url(#kahve)" stroke-width="2.5"/><path d="M11 41 h8" fill="none" stroke-width="2.5"/>
  </g>
</svg>
