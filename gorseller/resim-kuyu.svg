<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Kuyu (taş, çatılı, kovalı) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="280" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kirmizi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#ff9c8a"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#e0533d" stroke-width="3.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="50" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 26 l45 -20 l45 20z" fill="url(#kirmizi)"/>
    <path d="M28 26 v52 M102 26 v52" fill="none" stroke="#b07a42" stroke-width="6"/>
    <path d="M28 26 v52 M102 26 v52" fill="none" stroke-width="2"/>
    <path d="M28 40 h74" fill="none" stroke-width="4"/>
    <path d="M65 40 v14" fill="none" stroke-width="2.5"/><path d="M57 54 h16 l-2 12 h-12z" fill="url(#kahve)" stroke-width="3"/>
    <path d="M16 72 h98 v38 h-98z" fill="url(#gri)"/>
    <path d="M16 84 h98 M16 97 h98 M40 72 v12 M76 72 v12 M28 84 v13 M58 84 v13 M94 84 v13 M44 97 v13 M80 97 v13" fill="none" stroke-width="2.5"/>
  </g>
</svg>
