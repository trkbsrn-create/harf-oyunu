<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Terlik (bir çift) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="184" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="terlik" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="7" height="7" fill="#9be3dc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#4fc3b8" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="pembe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffd2c8"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ff9c8a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 98 q-4 -30 22 -36 q22 -2 26 26 q2 14 -12 16z" fill="url(#terlik)"/>
    <path d="M14 76 q16 -18 34 0 v6 h-34z" fill="url(#pembe)"/>
    <path d="M70 98 q-4 -30 22 -36 q22 -2 26 26 q2 14 -12 16z" fill="url(#terlik)"/>
    <path d="M76 76 q16 -18 34 0 v6 h-34z" fill="url(#pembe)"/>
  </g>
</svg>
