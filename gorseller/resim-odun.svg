<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Odun (üst üste kütükler) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="264" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="kesit" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="5" height="5" fill="#f2d7b0"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#d9b07a" stroke-width="2" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="112" rx="54" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 82 h96 v26 h-96z M14 56 h96 v26 h-96z" fill="url(#kahve)"/>
    <path d="M38 30 h56 v26 h-56z" fill="url(#kahve)"/>
    <ellipse cx="14" cy="95" rx="10" ry="13" fill="url(#kesit)"/><ellipse cx="14" cy="69" rx="10" ry="13" fill="url(#kesit)"/>
    <ellipse cx="38" cy="43" rx="10" ry="13" fill="url(#kesit)"/>
    <circle cx="14" cy="95" r="4" fill="none" stroke-width="2"/><circle cx="14" cy="69" r="4" fill="none" stroke-width="2"/><circle cx="38" cy="43" r="4" fill="none" stroke-width="2"/>
    <path d="M40 92 h30 M56 66 h34 M58 40 h20" fill="none" stroke-width="2.5"/>
  </g>
</svg>
