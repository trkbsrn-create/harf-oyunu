<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Baykuş (iri gözlü) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="805" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="bAcik" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-30)">
      <rect width="6" height="6" fill="#f2d7b0"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#d9b07a" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="116" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 26 l10 -18 l12 14 h26 l12 -14 l10 18 q12 30 4 60 q-10 28 -39 28 q-29 0 -39 -28 q-8 -30 4 -60z" fill="url(#kahve)"/>
    <path d="M44 66 q21 -10 42 0 q-2 36 -21 40 q-19 -4 -21 -40z" fill="url(#bAcik)" stroke-width="3"/>
    <circle cx="48" cy="44" r="15" fill="#ffffff"/><circle cx="82" cy="44" r="15" fill="#ffffff"/>
    <circle cx="48" cy="44" r="7" fill="#2b2b2b"/><circle cx="82" cy="44" r="7" fill="#2b2b2b"/>
    <path d="M60 56 l5 10 l5 -10z" fill="#ffc928" stroke-width="2.5"/>
  </g>
</svg>
