<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Terazi (iki kefeli) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="850" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="sari" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-40)">
      <rect width="6" height="6" fill="#ffe680"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#ffc928" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g transform="translate(3.9 3.6) scale(0.94)">
  <ellipse cx="65" cy="116" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M65 16 v92 M44 112 h42" fill="none" stroke-width="6"/>
    <path d="M14 30 h102" fill="none" stroke-width="5"/>
    <path d="M14 30 l-10 40 M14 30 l10 40 M116 30 l-10 40 M116 30 l10 40" fill="none" stroke-width="2"/>
    <path d="M0 70 q14 16 28 0z M102 70 q14 16 28 0z" fill="url(#sari)" stroke-width="3"/>
    <circle cx="65" cy="16" r="6" fill="url(#sari)" stroke-width="3"/>
  </g>
  </g>
</svg>
