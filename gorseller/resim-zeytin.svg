<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Zeytin (dalda) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="151" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="zeytin" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#7f9a4a"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#5b7230" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 30 q60 -10 118 30" fill="none" stroke="#8a6a3c" stroke-width="5"/>
    <path d="M30 26 q10 -20 30 -18 q-12 16 -30 18z M76 30 q16 -18 36 -10 q-16 14 -36 10z M52 30 q-4 22 -20 30 q-2 -18 20 -30z" fill="url(#yesil)"/>
    <path d="M70 36 l0 10 M98 48 l-2 12" fill="none" stroke-width="3"/>
    <ellipse cx="70" cy="64" rx="14" ry="19" fill="url(#zeytin)"/>
    <ellipse cx="96" cy="78" rx="13" ry="18" fill="url(#zeytin)"/>
    <path d="M64 56 q2 -6 6 -8 M90 70 q2 -6 6 -8" fill="none" stroke="#ffffff" stroke-width="3"/>
  </g>
</svg>
