<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Telefon (akıllı telefon) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="445" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="mavi" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#bfe3f5"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#7cc3e6" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M40 8 h50 q8 0 8 8 v88 q0 8 -8 8 h-50 q-8 0 -8 -8 v-88 q0 -8 8 -8z" fill="#2b2b2b"/>
    <path d="M38 22 h54 v72 h-54z" fill="url(#mavi)" stroke-width="2.5"/>
    <circle cx="65" cy="103" r="4" fill="#ffffff" stroke="none"/>
    <path d="M58 14 h14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M46 34 h12 v12 h-12z M66 34 h12 v12 h-12z M46 54 h12 v12 h-12z M66 54 h12 v12 h-12z" fill="#ffffff" stroke-width="2"/>
  </g>
</svg>
