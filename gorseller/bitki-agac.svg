    <circle cx="94" cy="104" r="6" fill="#ffb3c8" stroke-width="2.5"/>
    <circle cx="94" cy="104" r="2" fill="#ffe680" stroke="none"/>
    <circle cx="30" cy="98" r="6" fill="#ffb3c8" stroke-width="2.5"/>
