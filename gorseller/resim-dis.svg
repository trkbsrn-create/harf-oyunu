<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Diş (gülen) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="211" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="dis" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#eef2f6" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 22 q18 -14 35 0 q17 -14 35 0 q14 16 4 46 q-4 18 -8 38 q-4 8 -10 0 l-8 -28 q-3 -6 -6 0 l-8 28 q-6 8 -10 0 q-4 -20 -8 -38 q-10 -30 4 -46z" fill="url(#dis)"/>
    <circle cx="52" cy="44" r="3" fill="#2b2b2b"/><circle cx="78" cy="44" r="3" fill="#2b2b2b"/>
    <path d="M56 56 q9 8 18 0" fill="none" stroke-width="3"/>
    <path d="M40 30 q6 -6 12 -6" fill="none" stroke="#bfe3f5" stroke-width="4"/>
  </g>
</svg>
