<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Armut (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="113" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="armut" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="7" height="7" fill="#e4f2a0"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b9d65a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="yesil" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9eba7"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#8fd16a" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M64 22 q2 -12 8 -18" fill="none" stroke-width="5"/>
    <path d="M70 14 q18 -12 30 -2 q-14 12 -30 2z" fill="url(#yesil)"/>
    <path d="M64 20 q-16 0 -16 24 q0 12 -12 26 q-10 14 -6 26 q8 18 34 16 q26 2 34 -16 q4 -12 -6 -26 q-12 -14 -12 -26 q0 -24 -16 -24z" fill="url(#armut)"/>
    <path d="M44 74 q2 -10 8 -16" fill="none" stroke="#ffffff" stroke-width="5"/>
  </g>
</svg>
