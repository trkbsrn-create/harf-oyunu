<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Mini oyun simgesi: Heceyi Bul (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="207" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="turuncu" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-35)">
      <rect width="6" height="6" fill="#ffc58f"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#f08a3c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="su" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="6" height="6" fill="#c9ecff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#7cc4ef" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 82 q12 -8 24 0 t24 0 t24 0 t24 0" fill="none" stroke="#7cc4ef" stroke-width="4"/>
    <path d="M70 48 q-16 -24 -44 -14 q-16 6 -18 16 q2 10 18 16 q28 10 44 -14z" fill="url(#turuncu)"/>
    <path d="M70 48 l22 -16 q-4 16 0 32z" fill="url(#turuncu)"/>
    <circle cx="24" cy="44" r="3.5" fill="#2b2b2b"/>
    <path d="M40 38 q6 10 0 20 M52 36 q6 12 0 24" fill="none" stroke-width="3"/>
  </g>
</svg>
