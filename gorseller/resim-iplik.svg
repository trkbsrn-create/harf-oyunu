<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- İplik (makara) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="204" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="kahve" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d9a46b"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#b07a42" stroke-width="3" stroke-linecap="round"/>
    </pattern>
    <pattern id="iplik" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="5" height="5" fill="#ff9c8a"/>
      <line x1="0" y1="2.5" x2="5" y2="2.5" stroke="#e0533d" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="65" cy="114" rx="34" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M34 22 h62 v12 h-62z M34 96 h62 v12 h-62z" fill="url(#kahve)"/>
    <path d="M42 34 h46 v62 h-46z" fill="url(#iplik)"/>
    <path d="M88 60 q24 10 18 30 q-6 14 10 20" fill="none" stroke="#e0533d" stroke-width="3"/>
  </g>
</svg>
