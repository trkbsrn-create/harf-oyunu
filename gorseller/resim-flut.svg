<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Flüt (yan flüt) (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="495" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 76 l112 -40 l6 14 l-112 40z" fill="url(#gri)"/>
    <circle cx="30" cy="74" r="3.5" fill="#2b2b2b"/><circle cx="50" cy="67" r="3.5" fill="#2b2b2b"/><circle cx="64" cy="62" r="3.5" fill="#2b2b2b"/>
    <circle cx="78" cy="57" r="3.5" fill="#2b2b2b"/><circle cx="92" cy="52" r="3.5" fill="#2b2b2b"/><circle cx="106" cy="47" r="3.5" fill="#2b2b2b"/>
    <path d="M40 98 q6 -10 0 -18 M54 104 v-10 q4 0 4 4" fill="none" stroke="#7cc3e6" stroke-width="3"/>
    <circle cx="42" cy="100" r="3" fill="#7cc3e6" stroke="none"/><circle cx="52" cy="104" r="3" fill="#7cc3e6" stroke="none"/>
  </g>
</svg>
