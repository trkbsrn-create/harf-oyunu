<svg xmlns="http://www.w3.org/2000/svg" width="130" height="120" viewBox="0 0 130 120">
  <!-- Koyun (doodle tarzı, kendi çizimimiz) -->
  <defs>
    <filter id="titrek" filterUnits="userSpaceOnUse" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="147" result="g"/>
      <feDisplacementMap in="SourceGraphic" in2="g" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <pattern id="yun" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="6" height="6" fill="#ffffff"/>
      <line x1="0" y1="3.0" x2="6" y2="3.0" stroke="#e6e6e6" stroke-width="2.5" stroke-linecap="round"/>
    </pattern>
    <pattern id="gri" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <rect width="7" height="7" fill="#d6d3cc"/>
      <line x1="0" y1="3.5" x2="7" y2="3.5" stroke="#a9a59c" stroke-width="3" stroke-linecap="round"/>
    </pattern>
  </defs>
  <ellipse cx="66" cy="114" rx="46" ry="5" fill="#000" fill-opacity="0.13"/>
  <g filter="url(#titrek)" stroke="#2b2b2b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M42 86 v24 M56 88 v22 M82 88 v22 M96 86 v24" fill="none" stroke-width="6"/>
    <path d="M30 60 q-6 -20 14 -24 q6 -16 24 -10 q14 -12 28 2 q20 0 18 20 q14 12 2 26 q-2 18 -22 16 q-12 12 -28 2 q-18 8 -26 -8 q-18 -6 -10 -24z" fill="url(#yun)"/>
    <ellipse cx="24" cy="58" rx="16" ry="20" fill="url(#gri)"/>
    <path d="M12 46 q-10 -2 -10 6 q6 6 12 2 M34 44 q10 -4 12 4 q-6 6 -12 2" fill="url(#gri)" stroke-width="3"/>
    <circle cx="18" cy="56" r="2.8" fill="#2b2b2b"/><circle cx="30" cy="56" r="2.8" fill="#2b2b2b"/>
    <path d="M20 68 q4 4 8 0" fill="none" stroke-width="2.5"/>
  </g>
