<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mikrofon Testi</title>
  <style>
    @font-face {
      font-family: "Andika";
      src: url("yazitipi/Andika-Regular.ttf") format("truetype");
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #bfe8f5;
      font-family: "Andika", sans-serif;
      color: #3b2a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 32px 16px;
      box-sizing: border-box;
    }
    h1 { margin: 0; font-size: 44px; }
    p { margin: 0; font-size: 22px; text-align: center; max-width: 640px; }
    button {
      font-family: inherit;
      font-size: 36px;
      padding: 18px 48px;
      border: 5px solid #3b2a1a;
      border-radius: 28px;
      background: #ffcf3f;
      color: #3b2a1a;
      cursor: pointer;
    }
    button:disabled { background: #e6cfa3; cursor: default; }
    #durum { font-size: 26px; min-height: 36px; }
    #duyulan {
      font-size: 48px;
      background: #fff;
      border: 5px solid #3b2a1a;
      border-radius: 28px;
      padding: 16px 32px;
      min-width: 280px;
      min-height: 64px;
      text-align: center;
    }
    #tahminler { font-size: 20px; color: #7a5c3e; text-align: center; }
    #gosterge {
      position: relative;
      width: min(480px, 90vw);
      height: 34px;
      border: 5px solid #3b2a1a;
      border-radius: 20px;
      background: #fff;
      overflow: hidden;
    }
    #cubuk { height: 100%; width: 0; background: #6cc05a; transition: width 60ms; }
    #esik { position: absolute; top: 0; bottom: 0; width: 4px; background: #e0533d; }
    #sesBilgisi { font-size: 22px; text-align: center; min-height: 30px; }
    #aCanli { font-size: 30px; min-height: 40px; }
    #aBilgisi { font-size: 22px; text-align: center; min-height: 30px; }
    #olcumler { font-size: 16px; color: #7a5c3e; text-align: center; min-height: 20px; }
    a { color: #2c7c76; font-size: 22px; }
  </style>
</head>
<body>
  <h1>Mikrofon Testi</h1>
  <p>Düğmeye basıp bir şey söyleyin; örneğin "aaaaa" (uzatarak), "kedi" ya da "leylek".
     Chrome'un duyduğu ekrana yazılır. Hiçbir ses kaydedilmez.</p>
  <button id="dugme">Dinle</button>
  <div id="durum"></div>
  <div id="duyulan"></div>
  <div id="tahminler"></div>
  <p>Ses göstergesi (kırmızı çizginin sağı "net ses" sayılır):</p>
  <div id="gosterge"><div id="cubuk"></div><div id="esik"></div></div>
  <div id="sesBilgisi"></div>
  <p>"a" sesi denetimi (oyundaki "a" sandığı için):</p>
  <div id="aCanli"></div>
  <div id="aBilgisi"></div>
  <div id="olcumler"></div>
  <a href="index.html">Oyuna dön</a>

  <script src="dinleyici.js"></script>
  <script>
    const dugme = document.getElementById("dugme");
    const durum = document.getElementById("durum");
    const duyulan = document.getElementById("duyulan");
    const tahminler = document.getElementById("tahminler");

    if (!Dinleyici.Tanima) {
      durum.textContent = "Bu tarayıcıda konuşma tanıma yok. Lütfen Chrome kullanın.";
      dugme.disabled = true;
    }

    const cubuk = document.getElementById("cubuk");
    const sesBilgisi = document.getElementById("sesBilgisi");
    const OLCEK = 0.25; // bu yükseklik göstergeyi tamamen doldurur
    document.getElementById("esik").style.left = (Dinleyici.ENAZ_ESIK / OLCEK) * 100 + "%";
    function gostergeyiCiz() {
      const oran = Math.min(1, Dinleyici.seviye() / OLCEK);
      cubuk.style.width = oran * 100 + "%";
      requestAnimationFrame(gostergeyiCiz);
    }

    Dinleyici.onDuydu = (enIyi) => {
      duyulan.textContent = enIyi;
    };

    dugme.addEventListener("click", async () => {
      dugme.disabled = true;
      duyulan.textContent = "";
      tahminler.textContent = "";
      sesBilgisi.textContent = "";
      if (!Dinleyici.olcer && await Dinleyici.olcerHazirla()) gostergeyiCiz();
      durum.textContent = "Dinliyorum... şimdi konuşun.";
      // "a" denetimi: dinlerken her 40 ms'de sesin tınısına bakılır
      const aCanli = document.getElementById("aCanli");
      const aBilgisi = document.getElementById("aBilgisi");
      const olcumler = document.getElementById("olcumler");
      aBilgisi.textContent = "";
      olcumler.textContent = "";
      let sesli = 0;
      let benzeyen = 0;
      const f0ler = [], f1ler = [], f2ler = [];
      const aDenetimi = Dinleyici.olcer ? setInterval(() => {
        const k = Dinleyici.sesiIncele();
        if (!k.sesli) {
          aCanli.textContent = k.ses ? "Konuşma sesi değil" : "";
          return;
        }
        sesli++;
        f0ler.push(k.f0); f1ler.push(k.f1); f2ler.push(k.f2);
        const benziyor = Dinleyici.unluyeBenziyor(k, "a");
        if (benziyor) benzeyen++;
        aCanli.textContent = benziyor ? "✓ \"a\" sesine benziyor" : "✗ \"a\" sesine benzemiyor";
      }, 40) : null;
      const metinler = await Dinleyici.dinle(8000, Dinleyici.DOLUM_SURESI);
      if (aDenetimi) {
        clearInterval(aDenetimi);
        aCanli.textContent = "";
        const orta = (x) => x.sort((p, q) => p - q)[Math.floor(x.length / 2)];
        if (sesli >= 8) {
          const yuzde = Math.round((benzeyen / sesli) * 100);
          aBilgisi.textContent = `Konuşma sesinin %${yuzde}'i "a"ya benziyordu. ` +
            (yuzde >= 60 ? "Oyun bunu \"a\" olarak kabul eder." : "Oyun bunu \"a\" olarak kabul etmez.");
          olcumler.textContent = `Ölçümler (Claude'a iletmek için): perde ${orta(f0ler)} Hz, F1 ${orta(f1ler)} Hz, F2 ${orta(f2ler)} Hz`;
        } else {
          aBilgisi.textContent = "Yeterince konuşma sesi duyulmadı.";
        }
      }
      const saniye = (Dinleyici.sonSesSuresi / 1000).toLocaleString("tr-TR");
      sesBilgisi.textContent = Dinleyici.olcer
        ? `Net ses süresi: ${saniye} saniye. ` + (Dinleyici.sonSesSuresi >= Dinleyici.DOLUM_SURESI
          ? "Bu, oyunda harfi tamamen doldurur."
          : `Oyunda harfi doldurmak için sesi ${Dinleyici.DOLUM_SURESI / 1000} saniye uzatmak gerekir.`)
        : "Ses göstergesi çalışmıyor (mikrofon izni yok).";
      if (Dinleyici.izinYok) {
        durum.textContent = "Mikrofon izni verilmedi. Adres çubuğundaki kilit simgesinden izin verebilirsiniz.";
      } else if (metinler.length === 0) {
        durum.textContent = "Chrome bunu yazıya çeviremedi.";
      } else {
        durum.textContent = "Duyulan:";
        duyulan.textContent = Dinleyici.enIyi;
        const farkli = [...new Set(metinler.map((m) => m.trim()).filter(Boolean))];
        tahminler.textContent = "Chrome'un tüm tahminleri: " + farkli.join(" · ");
      }
      dugme.disabled = false;
    });
  </script>
</body>
</html>
