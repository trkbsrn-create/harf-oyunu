<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#fbf7ec">
  <!-- Telefona uygulama gibi eklenebilir (Android: "Ana ekrana ekle"/"Yükle", iPhone: Paylaş → Ana Ekrana Ekle) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="simge/simge-192.png">
  <link rel="apple-touch-icon" href="simge/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Harf Avcısı">
  <title>Harf Avcısı</title>
  <script>
    // Yazı tipi (oyunda adı hep "Andika"). Öğretmenin isteği: cihazda TTKB Dik Temel Abece (Bold)
    // kuruluysa o kullanılır; küçük harfleri Andika'dan küçük olduğu için %120 büyütülür. Kurulu
    // değilse Andika. TTKB'nin telifi yazarına ait; dosyası herkese açık depoya konmaz (izin istendi).
    window.yaziTipiHazir = new FontFace("Andika",
      'local("TTKB Dik Temel Abece Bold"), local("TTKBDikTemelAbece-Bold")', { sizeAdjust: "120%" })
      .load()
      .catch(() => new FontFace("Andika", 'url("yazitipi/Andika-Regular.ttf")').load())
      .then((yuz) => { document.fonts.add(yuz); })
      .catch(() => {});
  </script>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #fbf7ec;
      overflow: hidden;
      /* Telefonda: iki kez dokununca ya da iki parmakla büyütme, kaydırma, basılı tutunca
         çıkan menü ve yazı seçme kapalı (çocuk hızlı dokunur, sürükler) */
      touch-action: none;
      overscroll-behavior: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      position: fixed;
      inset: 0;
    }
    #oyun {
      width: 100%;
      height: 100%;
    }
    /* Dokunmatik cihaz dik tutulunca: "Telefonu yan çevir" uyarısı */
    #yan-cevir {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
      background: #fbf7ec;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      font-family: "Andika", sans-serif;
      font-size: 30px;
      color: #2b2b2b;
      text-align: center;
      padding: 24px;
    }
    #yan-cevir svg {
      width: 140px;
      height: 140px;
      animation: cevir 2s ease-in-out infinite;
    }
    @keyframes cevir {
      0%, 25% { transform: rotate(0deg); }
      60%, 100% { transform: rotate(-90deg); }
    }
    /* Açılış videosu (öğretmenin Drive'ı): "Oyunu başlat"tan sonra; "Videoyu geç" ile oyuna geçilir */
    #acilis-video {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 5;
      background: #2b2b2b;
      touch-action: auto;
    }
    #acilis-video iframe {
      width: 100%;
      height: 100%;
      border: 0;
    }
    #videoyu-gec {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 14px 28px;
      font-family: "Andika", sans-serif;
      font-size: 28px;
      color: #2b2b2b;
      background: #ffe27a;
      border: 4px solid #2b2b2b;
      border-radius: 18px;
      cursor: pointer;
    }
    @media (orientation: portrait) and (pointer: coarse) {
      #yan-cevir { display: flex; }
    }
  </style>
</head>
<body>
  <div id="oyun"></div>
  <div id="acilis-video">
    <iframe allow="autoplay; fullscreen" allowfullscreen title="Açılış videosu"></iframe>
    <button id="videoyu-gec" type="button">Videoyu geç ▶</button>
  </div>
  <div id="yan-cevir">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <rect x="30" y="10" width="40" height="80" rx="8" fill="#c9ecff" stroke="#2b2b2b" stroke-width="4"/>
      <rect x="36" y="20" width="28" height="56" rx="2" fill="#ffffff" stroke="#2b2b2b" stroke-width="2"/>
      <circle cx="50" cy="83" r="3" fill="#2b2b2b"/>
    </svg>
    <div>Telefonu yan çevir</div>
  </div>
  <script>
    // Telefonda ilk dokunuşta oyun tam ekrana geçer ve (destekleniyorsa) yatay ekrana kilitlenir.
    // Bilgisayarda (fare ile) bir şey değişmez. iPhone tam ekranı desteklemez; orada uyarı yeter.
    (function () {
      var dokunmatik = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
      if (!dokunmatik) return;
      document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
      function tamEkran() {
        var kok = document.documentElement;
        var iste = kok.requestFullscreen || kok.webkitRequestFullscreen;
        if (document.fullscreenElement || document.webkitFullscreenElement || !iste) return;
        try {
          var sonuc = iste.call(kok, { navigationUI: "hide" });
          if (sonuc && sonuc.then) {
            sonuc.then(function () {
              if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock("landscape").catch(function () {});
              }
            }).catch(function () {});
          }
        } catch (e) {}
      }
      document.addEventListener("pointerup", tamEkran, { once: true });

      // Telefon dik çevrilip yeniden yan çevrilince ekran kayıyordu: tarayıcı boyutunu geç bildiriyor,
      // oyun eski boyuta göre yerleşiyordu. Dönüşten sonra birkaç kez yeniden yerleştir, sayfayı başa kaydır.
      function yerlestir() {
        window.scrollTo(0, 0);
        var g = window.oyunNesnesi; // oyun açılmadan (tuval yokken) yerleştirilmez
        if (g && g.isBooted && g.scale && g.scale.canvas) g.scale.refresh();
      }
      function donunce() {
        [50, 250, 600, 1200].forEach(function (ms) { setTimeout(yerlestir, ms); });
      }
      window.addEventListener("orientationchange", donunce);
      window.addEventListener("resize", donunce);
      if (window.visualViewport) window.visualViewport.addEventListener("resize", donunce);
    })();

    // Uygulama olarak eklenebilsin (sw.js hiçbir şeyi önbelleğe almaz). Android'de "Yükle" isteği saklanır;
    // karşılama ekranındaki "Telefona ekle" düğmesi bunu kullanır.
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
    window.addEventListener("beforeinstallprompt", function (e) {
      e.preventDefault();
      window.yuklemeIstegi = e;
      if (window.yuklemeHazir) window.yuklemeHazir();
    });
  </script>
